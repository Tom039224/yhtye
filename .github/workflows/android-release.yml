name: Android release

# Pushing a tag `android-v<major>.<minor>.<patch>` builds the Android client (mobile/), signs it with the
# release key and attaches the APK to a GitHub Release. See docs/DEVELOPMENT.md ("Releasing the Android app").
# The Android app and the desktop app are released separately: this workflow only reacts to `android-v*` tags.

on:
  push:
    tags:
      - "android-v*"

# Creating the release needs write access; nothing else does.
permissions:
  contents: write

# Never run two releases of the same tag at once, and never cancel one half way through.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The tag is data from outside: it only reaches the scripts through the environment, never through
      # `${{ }}` inside a script.
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^android-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error title=Bad tag::'$TAG' is not android-v<major>.<minor>.<patch> (digits only, for example android-v0.1.0)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # versionCode = major*10000 + minor*100 + patch, so the minor and the patch are 0..99 (no leading zeros: 1 or 2 digits)
          if (( ${#minor} > 2 || ${#patch} > 2 )); then
            echo "::error title=Bad tag::the minor and the patch of '$TAG' must be 0..99 (versionCode has two digits for each)"
            exit 1
          fi
          if (( ${#major} > 5 )); then
            echo "::error title=Bad tag::the major of '$TAG' is too large for versionCode"
            exit 1
          fi
          version="$major.$minor.$patch"
          code=$(( major * 10000 + minor * 100 + patch ))
          # While the version starts with 0. the app is a pre-release (0.x: the minor version can break compatibility).
          if [[ "$major" == "0" ]]; then
            prerelease=true
            compatible="PC の Yhtye ${major}.${minor}.x と互換"
          else
            prerelease=false
            compatible="PC の Yhtye ${major}.${minor}.x 以降の ${major}.x と互換"
          fi
          {
            echo "version=$version"
            echo "code=$code"
            echo "prerelease=$prerelease"
            echo "compatible=$compatible"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Android $version (versionCode $code, pre-release: $prerelease)"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the command-line tools and accepts the licenses; Gradle (AGP) downloads the platform and
      # the build tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-gone `tools` package, which makes sdkmanager fail.
          packages: platform-tools

      # The key lives in the repository secrets only. It is restored to a temporary file that only this
      # job can read, and removed at the end.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error title=No signing key::the secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/yhtye-release.p12"
          ( umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore" )
          echo "YHTYE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # No configuration cache and no build cache: the build reads the key's passwords, and a release build
      # should come out of a clean build anyway.
      - name: Build the signed release APK
        working-directory: mobile
        env:
          YHTYE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YHTYE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YHTYE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache \
            :androidApp:assembleRelease "-Pyhtye.versionName=$VERSION"

      # An unsigned build is called *-release-unsigned.apk, so a missing signing config stops here.
      - name: Verify the signature and the version
        id: apk
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CODE: ${{ steps.tag.outputs.code }}
        run: |
          built="$(find mobile/androidApp/build/outputs/apk/release -name '*-release.apk')"
          if [[ -z "$built" || "$(wc -l <<< "$built")" -ne 1 ]]; then
            echo "::error title=No signed APK::expected exactly one signed release APK, found: ${built:-none}"
            ls -l mobile/androidApp/build/outputs/apk/release || true
            exit 1
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${tools}apksigner" verify --verbose --print-certs "$built"
          badging="$("${tools}aapt2" dump badging "$built")"
          if ! grep -q "^package: name='io.github.tom039224.yhtye' versionCode='$CODE' versionName='$VERSION'" <<< "$badging"; then
            echo "::error title=Wrong version::the APK does not carry versionName $VERSION / versionCode $CODE"
            grep '^package:' <<< "$badging" || true
            exit 1
          fi
          apk="yhtye-android-$VERSION.apk"
          cp "$built" "$RUNNER_TEMP/$apk"
          echo "path=$RUNNER_TEMP/$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/$apk"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          COMPATIBLE: ${{ steps.tag.outputs.compatible }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<NOTES
          **${COMPATIBLE}** です。

          - 互換性は版番号で決まります。0.x の間は \`0.<minor>\` が PC とスマホで同じなら互換、1.0 以降はメジャーが同じで PC のマイナーがスマホのマイナー以上なら互換です。パッチは PC と Android で独立しています。詳しくは README の「Android 版」を見てください。
          - インストール: \`yhtye-android-${VERSION}.apk\` を端末にダウンロードして開きます (提供元不明のアプリの許可が要ります)。前の版に上書きできます。
          - 初回は PC の Yhtye で「設定 → リモート接続」を開き、QR コードでペアリングします (PC と端末が同じ Tailscale アカウントでつながっている必要があります)。
          NOTES
          args=(--title "Yhtye Android ${VERSION} (${COMPATIBLE})" --notes-file "$notes" --verify-tag --latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "$APK" "${args[@]}"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yhtye-release.p12"
