name: Windows release

# Pushing a tag `windows-v<major>.<minor>.<patch>` builds the desktop app (src-tauri/) for Windows 10 / 11 (x64 and
# ARM64) and attaches the NSIS installers (x64 and ARM64) and the MSI (x64 only), plus SHA256SUMS, to a GitHub
# Release. See docs/DEVELOPMENT.md ("Releasing the Windows desktop app"). The desktop app for Linux, the one for
# Windows and the Android app are released separately: this workflow only reacts to `windows-v*` tags
# (`linux-v*` and `android-v*` have their own workflows).
#
# Each architecture is built natively on its own runner (windows-latest = x64, windows-11-arm = ARM64): ci.yml
# already builds the whole workspace on both, which a cross build from x64 would not prove (the C dependencies
# such as aws-lc-sys / ring need the ARM64 MSVC tools), and the ARM64 installer can then be run on the runner
# that built it. The MSI is x64 only: WiX 3, which Tauri drives, has no ARM64 support worth relying on. The NSIS
# installer is the one every user gets.
#
# Not signed yet. When a code signing certificate exists, put it in the repository secrets and sign in the
# "Build the installers" step: Tauri signs by itself when `bundle.windows.certificateThumbprint` (with
# `digestAlgorithm` and `timestampUrl`) is set in tauri.conf.json or `signCommand` points at a signing tool (for
# example Azure Trusted Signing / a cloud HSM, which is what you need on a runner). Until then SmartScreen warns
# "Windows protected your PC" on the first run; that is expected.

on:
  push:
    tags:
      - "windows-v*"

# Read-only by default; only the `release` job asks for write access.
permissions:
  contents: read

# Never run two releases of the same tag at once, and never cancel one half way through.
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checks the tag once, for both builds and the release.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      compatible: ${{ steps.tag.outputs.compatible }}
    steps:
      # The tag is data from outside: it only reaches the scripts through the environment, never through
      # `${{ }}` inside a script.
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^windows-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error title=Bad tag::'$TAG' is not windows-v<major>.<minor>.<patch> (digits only, for example windows-v0.1.0)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$major.$minor.$patch"
          # While the version starts with 0. the app is a pre-release (0.x: the minor version can break compatibility).
          # The rule is the Android app's (mobile/shared/.../version/Compatibility.kt): 0.x needs the same 0.<minor>;
          # from 1.0 the major is the same and the PC's minor is at least the phone's minor.
          if [[ "$major" == "0" ]]; then
            prerelease=true
            compatible="Android 版 ${major}.${minor}.x と互換"
          else
            prerelease=false
            compatible="Android 版 ${major}.0.x〜${major}.${minor}.x と互換"
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "compatible=$compatible"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing the Windows desktop app $version (pre-release: $prerelease)"

  # Builds and checks the installers. It runs dependency install scripts and the whole build, so it only has the
  # read-only token (and the checkout does not keep it). The installers go to the `release` job as artifacts.
  build:
    needs: tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Same toolchain setup as the `frontend` and `rust` jobs of ci.yml (pnpm 11, Node 22, stable Rust; there is
      # no rust-toolchain file). Node is also what reads the JSON below: jq is not on every Windows image.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Caches the dependencies' build. A tag only sees its own caches, so this helps when a failed run of the
      # same tag is re-run (cache-on-failure), not the next release; and it is only ever read back by this job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # The version lives in three places that are changed together (see app_version.rs, which checks the same
      # thing in CI). The tag must name exactly that version.
      - name: Check the version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          bad=0
          check() {
            if [[ "$2" != "$VERSION" ]]; then
              echo "::error title=Version mismatch::$1 has version '$2' but the tag says '$VERSION'"
              bad=1
            fi
          }
          json_version() { node -p "require('./$1').version ?? ''"; }
          check "Cargo.toml ([workspace.package] version)" \
            "$(awk '/^\[/ { in_package = ($0 == "[workspace.package]") } in_package && /^version[[:space:]]*=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }' Cargo.toml)"
          check "src-tauri/tauri.conf.json" "$(json_version src-tauri/tauri.conf.json)"
          check "package.json" "$(json_version package.json)"
          if ! grep -Eq '^[[:space:]]*version\.workspace[[:space:]]*=[[:space:]]*true[[:space:]]*$' src-tauri/Cargo.toml; then
            echo "::error title=Version mismatch::src-tauri/Cargo.toml must take its version from the workspace (version.workspace = true)"
            bad=1
          fi
          if (( bad != 0 )); then
            exit 1
          fi
          echo "All the versions are $VERSION"

      - run: pnpm install --frozen-lockfile

      # `--bundles` is explicit (tauri.conf.json says "all"); `--locked` makes a Cargo.lock that is out of date
      # a failure instead of a silent update. `--target` is given even though each runner builds for its own
      # architecture, so that both land in target/<triple>/release/bundle/. There is no updater, so nothing is
      # signed (see the note at the top for where signing goes).
      - name: Build the installers
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      # Each installer must exist exactly once and carry the version, and the app inside must be built for the
      # architecture of this matrix entry (the PE header of the .exe says so).
      - name: Verify and collect the installers
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          bundle="target/$TARGET/release/bundle"
          mkdir release
          IFS=, read -ra kinds <<< "$BUNDLES"
          for kind in "${kinds[@]}"; do
            ext="exe"
            if [[ "$kind" == msi ]]; then ext="msi"; fi
            mapfile -t found < <(find "$bundle/$kind" -maxdepth 1 -type f -name "*.$ext" 2>/dev/null)
            if (( ${#found[@]} != 1 )); then
              echo "::error title=Wrong bundles::expected exactly one .$ext in $bundle/$kind, found: ${found[*]:-none}"
              ls -lR "$bundle" || true
              exit 1
            fi
            if [[ "${found[0]}" != *"${VERSION}"* ]]; then
              echo "::error title=Wrong version::${found[0]} does not carry the version $VERSION"
              exit 1
            fi
            if [[ "$kind" == nsis ]]; then
              cp "${found[0]}" "release/yhtye-windows-$VERSION-$ARCH-setup.exe"
            else
              cp "${found[0]}" "release/yhtye-windows-$VERSION-$ARCH.msi"
            fi
          done

          # The app itself (not the installer): the PE header's Machine field, 0x8664 = x64, 0xAA64 = ARM64.
          app="$(find "target/$TARGET/release" -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          if [[ -z "$app" ]]; then
            echo "::error title=No app::no .exe in target/$TARGET/release"
            exit 1
          fi
          machine="$(od -An -tx1 -j "$(( $(od -An -tu4 -j 60 -N 4 "$app") + 4 ))" -N 2 "$app" | tr -d ' \n')"
          case "$ARCH:$machine" in
            x64:6486|arm64:64aa) echo "$app is built for $ARCH" ;;
            *)
              echo "::error title=Wrong architecture::$app has machine type bytes '$machine', not $ARCH"
              exit 1
              ;;
          esac

          ( cd release && sha256sum -- yhtye-windows-* > "SHA256SUMS-$ARCH" && cat "SHA256SUMS-$ARCH" )

      # Runs the NSIS installer that will be released (silently, per user: the default install mode), checks that
      # an app was installed (and warns if the `yhtye://` link handler was not registered), then uninstalls it. `/S` would be
      # mangled by Git Bash, so this step is PowerShell. The uninstaller is run with `_?=<dir>` so that it waits
      # instead of copying itself to a temp directory and returning at once.
      - name: Install and uninstall the NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "release/yhtye-windows-$env:VERSION-$env:ARCH-setup.exe").Path
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "the installer exited with $($proc.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Yhtye'
          if (-not (Test-Path $dir)) { throw "the installer did not create $dir" }
          Get-ChildItem $dir | Format-Table Name, Length
          $apps = @(Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -ne 'uninstall.exe' })
          if ($apps.Count -eq 0) { throw "no app in $dir" }
          if (-not (Test-Path 'HKCU:\Software\Classes\yhtye')) { Write-Host "::warning title=No link handler::the yhtye:// link handler is not registered by the installer" }
          $un = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "the uninstaller exited with $($un.ExitCode)" }
          Write-Host "Installed and uninstalled the $env:ARCH installer"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ matrix.arch }}
          path: release
          if-no-files-found: error
          retention-days: 7

  # Only publishes: no repository code runs here. Nothing is released unless every check above passed (both
  # architectures: `build` has to succeed for the whole matrix).
  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: windows-release-*
          merge-multiple: true
          path: release

      # One SHA256SUMS for the release, from the per-architecture ones (each was made next to its own files).
      - name: Check the files
        run: |
          cd release
          cat SHA256SUMS-* > SHA256SUMS
          rm SHA256SUMS-*
          sha256sum --check SHA256SUMS
          ls -l

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          COMPATIBLE: ${{ needs.tag.outputs.compatible }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<NOTES
          **${COMPATIBLE}** です。

          - 互換性は版番号で決まります。0.x の間は \`0.<minor>\` が PC とスマホで同じなら互換、1.0 以降はメジャーが同じで PC のマイナーがスマホのマイナー以上なら互換です。パッチは PC と Android で独立しています。詳しくは README の「Android 版」を見てください。Android 版は \`android-v…\` のリリースから入れます。
          - 対象は Windows 10 / 11 (x64 と ARM64) です。**署名していない**ので、初回の起動で SmartScreen が「Windows によって PC が保護されました」と出します (「詳細情報」→「実行」)。動作確認は CI での無人のインストールとアンインストールだけで、実機でのエージェントの実行は未確認です。
          - **ヘッドレスモード (\`yhtye --headless\`、\`yhtye remote …\`) は Windows では未対応です。** 別の PC のヘッドレスに接続するクライアントとして使えます。
          - 形式は 2 つです。どちらも中身は同じアプリです。
            - \`yhtye-windows-${VERSION}-x64-setup.exe\` / \`yhtye-windows-${VERSION}-arm64-setup.exe\`: 普通のインストーラ (NSIS。ユーザーごと、管理者権限は不要)。迷ったらこちら。ARM64 は Snapdragon などの Arm 版 Windows 用です。
            - \`yhtye-windows-${VERSION}-x64.msi\`: x64 のみ (MSI)。管理者がまとめて配るとき向け。
          - WebView2 が無い Windows 10 では、インストーラが WebView2 を取りに行きます (インターネット接続が要ります)。Windows 11 には最初から入っています。
          - 検証: \`SHA256SUMS\` を同じ場所に置いて PowerShell で \`Get-FileHash <ファイル>\` と見比べるか、Git Bash / WSL で \`sha256sum --check --ignore-missing SHA256SUMS\`。
          - エージェント (Claude Code など) は同梱していません。入れ方は [SETUP.md](${GITHUB_SERVER_URL}/${GH_REPO}/blob/${TAG}/SETUP.md) の「エージェントの準備」を見てください。
          NOTES
          args=(--title "Yhtye Windows ${VERSION} (${COMPATIBLE})" --notes-file "$notes" --verify-tag --latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/yhtye-windows-* release/SHA256SUMS "${args[@]}"
