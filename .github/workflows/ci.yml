name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # The real-browser check that the page itself never scrolls (scripts/check-layout.mjs). It drives
  # the Google Chrome that ubuntu-latest already has (YHTYE_CHROMIUM): playwright-core only talks to a
  # browser over CDP, so this saves `playwright install --with-deps chromium` (a download of about
  # 150 MB plus apt packages on every run) and one more thing that can fail. A missing Chrome fails
  # at once with a clear message instead of falling back to a download. It is a job of its own so
  # that it runs next to `frontend` and a failure shows what it is.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the layout
        run: |
          google-chrome --version
          pnpm check:layout
        env:
          YHTYE_CHROMIUM: /usr/bin/google-chrome
          # A screenshot of every state (about 10 MB), kept only when the check fails.
          YHTYE_LAYOUT_SHOTS: layout-shots
      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-shots
          path: layout-shots
          if-no-files-found: ignore
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    env:
      # Debug info would fill the runner's disk (the tests also build the fake
      # agent separately); line tables are enough for backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs frontendDist (../dist) to exist.
      - run: mkdir -p dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the generated-types check (api::typegen); #[ignore]d tests
      # that need real agents stay excluded.
      - run: cargo test --workspace
