[package]
name = "yhtye-core"
description = "Yhtye core: ACP client, MCP server, domain state machine (Tauri-independent)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum = { workspace = true, features = ["ws"] }
http.workspace = true
schemars.workspace = true
async-trait.workspace = true
getrandom.workspace = true
sha2.workspace = true
base64.workspace = true
url.workspace = true
gethostname.workspace = true
sqlx.workspace = true
ts-rs.workspace = true
toml.workspace = true
memchr.workspace = true
# `canonicalize` without the `\\?\` prefix on Windows (paths shown to users and compared with git's).
dunce = "1"
# The desktop client of remote access (`remote_client`): `ws://` to another Yhtye, no TLS (WireGuard encrypts).
tokio-tungstenite.workspace = true
# Model list of OpenRouter (Codex harness, Stage 7e): one public GET, no credentials.
reqwest = { workspace = true, features = ["rustls"] }

# Process groups and signals of the agent subprocesses (`crate::acp`).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Job Objects: the agent's process tree on Windows (`crate::acp`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# The OS credential store of each platform (`crate::secrets`).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
