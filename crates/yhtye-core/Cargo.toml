[package]
name = "yhtye-core"
description = "Yhtye core: ACP client, MCP server, domain state machine (Tauri-independent)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustix.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum.workspace = true
http.workspace = true
schemars.workspace = true
async-trait.workspace = true
getrandom.workspace = true
gethostname.workspace = true
sqlx.workspace = true
ts-rs.workspace = true
toml.workspace = true
# Model list of OpenRouter (Codex harness, Stage 7e): one public GET, no credentials.
reqwest = { workspace = true, features = ["rustls"] }

# The OS credential store of each platform (`crate::secrets`).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
