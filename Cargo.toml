[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# ACP: pin the minor version (API changes quickly; see docs/architecture/acp-harnesses.md §4)
agent-client-protocol = "~2.2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
tempfile = "3"

# Profiles must live in the workspace root (moved from src-tauri/Cargo.toml).
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
