[package]
name = "yhtye"
version.workspace = true
description = "Yhtye desktop app (Tauri shell around yhtye-core)"
authors = ["Kirsikka (GitHub: Tom039224)"]
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yhtye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# `yhtye://pair?…` links. The 2.4 line of this and of single-instance fits the tauri the lock holds (2.5+ need tauri 2.12).
tauri-plugin-deep-link = "~2.4"
# The OS folder picker for adding a project. 2.8+ need tauri 2.12; 2.7 asks for tauri-plugin-fs ^2.5.2, which the lock
# keeps at 2.5.2 (fs 2.6+ need tauri 2.12 too), so do not `cargo update` it.
tauri-plugin-dialog = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yhtye-core = { path = "../crates/yhtye-core" }
tokio = { workspace = true, features = ["signal", "net"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The data directory (the same rule as Tauri's app data dir), shared by the GUI and `--headless`.
dirs = "6"
# `yhtye remote pair` draws the pairing URI as a QR code in the terminal.
qrcode = { version = "0.14", default-features = false }
# The control socket's fallback path hash (`yhtye-<hash>.sock`).
sha2.workspace = true
# The control socket accepts only this user (and root).
rustix = { workspace = true, features = ["net"] }

# A second `yhtye` (a click on a `yhtye://pair?…` link starts one) hands its arguments to the running app
# instead of dying on the data directory lock; `deep-link` passes those links on to the deep-link plugin.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~2.4", features = ["deep-link"] }

[dev-dependencies]
tempfile.workspace = true
async-trait.workspace = true
