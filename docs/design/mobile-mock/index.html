<!doctype html>
<!--
  Yhtye Android クライアントの GUI モック (段階 3 の前に画面構成とジェスチャの感触を確かめるためのもの)。
  1 ファイル完結: 外部の CSS / JS / フォント / 画像を読まない。データはすべてダミー。

  T-63 で PC 版 (src/ui/) に合わせて作り直した。原則:
  - ユーザーはオーケストレータとだけ対話する。help / checkpoint / グループ完了はオーケストレータが扱うので、
    スマホも PC と同じく状態を表示するだけ (タスクカードが「対処中」の色になり help の文を出す)。
  - 文言・状態ラベル・操作は PC 版にあるものだけ (labels.ts / taskInfo.ts / TaskCard.tsx / TaskColumn.tsx ...)。
  - スマホならではの割り当て: 左右のスワイプでパネル、タスクの行の右→左スワイプでメンション、詳細は左→右スワイプで閉じる。
  仕様: docs/planned/android-client.md「段階 3: GUI の決定事項」、docs/design/orchestrator-desktop.md、
  docs/architecture/orchestration-model.md。色は src/styles/tokens.css (PC と同じダーク)。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Yhtye モバイル モック</title>
<style>
/* ---------- トークン (PC の src/styles/tokens.css と同じ値) ---------- */
:root {
  --font-ui: system-ui, "Noto Sans JP", "Hiragino Sans", "Roboto", sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", "Roboto Mono", "Menlo", monospace;
  --peek: 64px;          /* パネルが開いたとき中央が見えている幅 */
  --mockbar: 24px;
  --bg-app: #141312;
  --bg-center: #1e1d1b;
  --bg-panel: #1b1a18;
  --bg-rail: #141312;
  --bg-card: #23211f;
  --bg-inset: #1a1917;
  --bg-selected: #2c2824;
  --bg-chip: #2b2825;
  --bg-chip-dim: #232120;
  --bg-pressed: #33302b;
  --line: #2a2724;
  --line-card: #34302b;
  --line-dashed: #3a352f;
  --tx: #e8e5df;
  --tx-body: #ddd9d2;
  --tx-2: #b5afa5;
  --tx-3: #9a948a;
  --tx-4: #7d776e;
  --tx-5: #57524b;
  --accent: #d9a066;
  --accent-strong: #e0a45c;
  --on-accent: #1e1a15;
  --accent-soft: color-mix(in srgb, #d9a066 14%, transparent);
  --bubble-bg: color-mix(in srgb, #d9a066 11%, #1e1d1b);
  --bubble-line: color-mix(in srgb, #d9a066 26%, #1e1d1b);
  --impl-fg: oklch(0.86 0.07 250); --impl-bg: oklch(0.35 0.06 250); --impl-bar: oklch(0.66 0.11 250); --impl-sheen: oklch(0.9 0.06 250 / .55);
  --rev-fg: oklch(0.87 0.06 300);  --rev-bg: oklch(0.36 0.05 300);  --rev-bar: oklch(0.66 0.11 300);  --rev-sheen: oklch(0.9 0.06 300 / .55);
  --hand-fg: oklch(0.93 0.05 40);  --hand-bg: oklch(0.42 0.13 30);  --hand-bar: oklch(0.58 0.14 30);
  --done-fg: oklch(0.85 0.09 150); --done-bg: oklch(0.33 0.05 150); --done-bar: oklch(0.72 0.13 150);
  --hand-card-bg: oklch(0.23 0.03 30); --hand-card-line: oklch(0.4 0.09 30);
  --hand-card-tx: #d8c4b4; --hand-card-title: #f0e7df; --hand-card-meta: #8e7f74; --hand-card-meta-strong: #bfa48f; --hand-card-icon: #c7ab97;
  --usage-5h: oklch(0.7 0.14 55); --usage-week: oklch(0.72 0.11 150);
  --ring-head: oklch(0.75 0.15 150); --ring-track: oklch(0.72 0.13 150 / .28); --ring-stop: #4a453f;
  --code-bg: #161514;
  --shadow: 0 0 0 1px #2a2724, -8px 0 24px rgba(0,0,0,.45), 8px 0 24px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.35);
  --sheet-scrim: rgba(0,0,0,.5);
}

/* ---------- 土台 ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* 横スワイプはアプリが扱う: 既定ではブラウザに縦のパンだけ任せる。横にスクロールできる要素は下で上書きする */
* { touch-action: pan-y; }
.hscroll, .hscroll * { touch-action: pan-x pan-y; }
html, body { margin: 0; height: 100%; background: var(--bg-app); color: var(--tx-body);
  font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.dim { color: var(--tx-4); }
.spacer { flex: 1; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; display: block; }
svg.i.s16 { width: 16px; height: 16px; } svg.i.s14 { width: 14px; height: 14px; } svg.i.s12 { width: 12px; height: 12px; } svg.i.s24 { width: 24px; height: 24px; }
.spin { animation: yspin .9s linear infinite; }
@keyframes yspin { to { transform: rotate(360deg); } }
@keyframes ypulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@keyframes ybreathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
@keyframes ysheen { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
@keyframes caret { 50% { opacity: 0 } }

/* ---------- モック表示 (アプリの一部ではない) ---------- */
#mockbar { position: fixed; top: 0; left: 0; right: 0; height: var(--mockbar); z-index: 100;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font: 500 10.5px/1 var(--font-mono); letter-spacing: .06em; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-app)); border-bottom: 1px solid var(--line); }
#mockbar button { height: 18px; padding: 0 8px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); font: inherit; color: inherit; }

/* ---------- 3 層 (左パネル / 右パネル / 中央) ---------- */
#app { position: fixed; left: 0; right: 0; top: var(--mockbar); bottom: 0; overflow: hidden; background: var(--bg-app); }
.panel { position: absolute; top: 0; bottom: 0; width: calc(100% - var(--peek)); visibility: hidden;
  background: var(--bg-panel); display: flex; flex-direction: column; }
#left { left: 0; }
#right { right: 0; }
#app[data-reveal="left"] #left, #app[data-reveal="right"] #right { visibility: visible; }
#center { position: absolute; inset: 0; background: var(--bg-center); display: flex; flex-direction: column;
  will-change: transform; z-index: 2; }
#center.shifted { box-shadow: var(--shadow); border-radius: 14px; overflow: hidden; }
#shield { position: absolute; inset: 0; z-index: 20; display: none; background: var(--scrim); opacity: 0; touch-action: none; }
#center.shifted #shield { display: block; }
#app.dragging, #app.dragging * { user-select: none; -webkit-user-select: none; }

/* 端のスワイプの表示 (Android では戻るジェスチャの領域) */
.edge-hint { position: absolute; top: 0; bottom: 0; width: 24px; z-index: 60; pointer-events: none; opacity: 0;
  transition: opacity .25s; display: flex; align-items: center; }
.edge-hint.left { left: 0; background: linear-gradient(90deg, var(--accent-soft), transparent); }
.edge-hint.right { right: 0; justify-content: flex-end; background: linear-gradient(270deg, var(--accent-soft), transparent); }
.edge-hint.show { opacity: 1; }
.edge-hint span { font: 500 10px/1.3 var(--font-mono); color: var(--accent); writing-mode: vertical-rl; padding: 4px 2px; }

/* ---------- 共通の部品 ---------- */
.iconbtn { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; color: var(--tx-2); position: relative; flex: none; }
.iconbtn:active { background: var(--bg-pressed); }
.iconbtn.sm { width: 40px; height: 40px; border-radius: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 5px; border-radius: 6px;
  font: 500 11.5px/1 var(--font-ui); white-space: nowrap; flex: none; }
.chip svg.i { width: 13px; height: 13px; stroke-width: 2; }
.tone-waiting { color: var(--tx-3); background: var(--bg-chip); }
.tone-implementing, .gs-active { color: var(--impl-fg); background: var(--impl-bg); }
.tone-reviewing, .gs-finishing { color: var(--rev-fg); background: var(--rev-bg); }
.tone-handling, .gs-merge_blocked { color: var(--hand-fg); background: var(--hand-bg); }
.tone-done, .gs-done { color: var(--done-fg); background: var(--done-bg); }
.tone-cancelled, .gs-cancelled { color: var(--tx-4); background: var(--bg-chip-dim); }
.ti-waiting { color: var(--tx-3); } .ti-implementing { color: var(--impl-bar); } .ti-reviewing { color: var(--rev-bar); }
.ti-handling { color: var(--hand-bar); } .ti-done { color: var(--done-bar); } .ti-cancelled { color: var(--tx-5); }
.pill { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; height: 20px; padding: 0 7px; border-radius: 10px;
  border: 1px solid var(--line-card); color: var(--tx-3); font: 400 11px/1 var(--font-mono); white-space: nowrap; overflow: hidden; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
/* リング: PC の .ring と同じ 3 形 (running = 上辺が濃い緑で回る / ready = 中を抜いた緑 / stopped = グレーの輪郭) */
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ring-stop); flex: none; }
.ring.ready { border-color: var(--done-bar); }
.ring.running { border-color: var(--ring-track); border-top-color: var(--ring-head); animation: yspin .9s linear infinite; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #403c37; }
.dot.ok { background: var(--done-bar); }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
/* オーケストレータの状態 (PC の SessionBadge): 中を抜いた丸 = 未起動 / 緑 = 待機 / 青 + 光輪 = 作業中 */
.sdot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--tx-4); flex: none; }
.sdot.idle { border-color: var(--done-bar); background: var(--done-bar); }
.sdot.working { border-color: var(--impl-bar); background: var(--impl-bar); box-shadow: 0 0 0 3px var(--impl-bg); animation: ybreathe 2s ease-in-out infinite; }
.sbadge { width: 40px; height: 48px; display: grid; place-items: center; flex: none; color: var(--tx-3); }
.empty { margin: auto; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--tx-3); font-size: 14px; line-height: 1.7; }
.empty svg.i { width: 26px; height: 26px; color: var(--tx-5); }
.section-h { display: flex; align-items: center; gap: 6px; padding: 14px 14px 6px 16px; color: var(--tx-4);
  font: 500 11.5px/1 var(--font-ui); }
.btn { height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn.tonal { background: var(--bg-chip); color: var(--tx); }
.btn.outline { border: 1px solid var(--line-card); color: var(--tx-2); }

/* ---------- 中央: トップバー ---------- */
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.topbar .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-left: 2px; }
.topbar .title { font-size: 16px; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { display: flex; align-items: center; gap: 6px; min-width: 0; }

/* ---------- 会話 (PC の TranscriptView と同じ種類の項目) ---------- */
.msgs { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0 8px; overscroll-behavior: contain; display: flex; flex-direction: column; }
.msgs > .empty { flex: 1; }
.row { padding: 5px 16px; }
.row.user { display: flex; justify-content: flex-end; padding-top: 14px; }
.bubble { max-width: 86%; background: var(--bubble-bg); border: 1px solid var(--bubble-line); color: var(--tx);
  border-radius: 18px 18px 6px 18px; padding: 9px 13px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.bubble .queued { display: inline-flex; vertical-align: -2px; margin-left: 6px; color: var(--tx-3); }
.md { font-size: 15px; line-height: 1.7; color: var(--tx-body); word-break: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h3 { font-size: 17px; margin: 18px 0 8px; color: var(--tx); font-weight: 650; }
.md h4 { font-size: 15.5px; margin: 16px 0 6px; color: var(--tx); font-weight: 650; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md strong { color: var(--accent-strong); font-weight: 600; }
.md code.inl { font: 13px/1 var(--font-mono); background: var(--bg-chip); border-radius: 4px; padding: 2px 5px; color: var(--tx); }
.code { margin: 4px 0 12px; border: 1px solid var(--line-card); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.code .lang { font: 500 10.5px/1 var(--font-mono); color: var(--tx-4); padding: 8px 12px 0; letter-spacing: .06em; }
.code pre { margin: 0; padding: 8px 12px 12px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); color: var(--tx); }
.tablewrap { margin: 4px 0 12px; overflow-x: auto; border: 1px solid var(--line-card); border-radius: 10px; }
.tablewrap table { border-collapse: collapse; font-size: 13.5px; line-height: 1.5; min-width: 100%; }
.tablewrap th, .tablewrap td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tablewrap th { color: var(--tx-3); font-weight: 600; font-size: 12.5px; background: var(--bg-inset); }
.tablewrap tr:last-child td { border-bottom: 0; }
.caret { display: inline-block; width: 8px; height: 16px; vertical-align: -3px; background: var(--accent); margin-left: 2px; animation: caret 1s steps(1) infinite; }
/* ツール・Yhtye のツール・思考: 控えめなモノスペースの 1 行 */
.line { display: flex; align-items: center; gap: 8px; min-height: 30px; width: 100%; text-align: left; color: var(--tx-4);
  font: 400 12px/1.4 var(--font-mono); padding: 3px 0; }
.line .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .k { color: var(--tx-5); flex: none; }
.line .st { flex: none; display: inline-flex; }
.line .st.completed { color: var(--done-bar); } .line .st.failed { color: var(--hand-bar); } .line .st.in_progress { color: var(--tx-3); }
.line .chev { flex: none; color: var(--tx-5); transition: transform .15s; }
.line[aria-expanded="true"] .chev { transform: rotate(90deg); }
.line.err { color: var(--hand-fg); }
.fold-body { margin: 2px 0 6px 22px; padding: 8px 10px; border-radius: 8px; background: var(--bg-inset); border: 1px solid var(--line);
  font: 12px/1.55 var(--font-mono); color: var(--tx-3); white-space: pre-wrap; word-break: break-word; }
.fold-body.prose { font: 13.5px/1.6 var(--font-ui); }
/* 受信箱の通知: PC の .notice と同じく破線の控えめな枠 (色で警告しない) */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1px dashed var(--line-dashed); border-radius: 8px;
  padding: 8px 10px; font: 400 11.5px/1.5 var(--font-mono); color: var(--tx-4); }
.notice .nk { color: var(--tx-3); }
.notice .nb { flex: 1 1 100%; color: var(--tx-3); font-family: var(--font-ui); font-size: 13px; line-height: 1.55; }
.gcardc { border: 1px solid var(--line-card); border-radius: 10px; overflow: hidden; }
.gcardc .h { display: flex; align-items: center; gap: 7px; padding: 8px 10px; font: 500 12px/1.3 var(--font-mono); color: var(--tx-3); background: var(--bg-inset); }
.gcardc .h .t { flex: 1; min-width: 0; color: var(--tx); font-family: var(--font-ui); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcardc .r { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--tx-body); }
.gcardc .r .n { font: 500 11.5px/1 var(--font-mono); color: var(--tx-4); flex: none; }
.gcardc .r .tt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* グループ待機バナー (PC の WaitBanner。文はツールチップの代わりに見せる) */
.waitbar { flex: none; margin: 0 12px 6px; display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: start; padding: 8px 12px 9px;
  border: 1px dashed var(--line-dashed); border-radius: 10px; background: var(--bg-inset); color: var(--tx-3); font-size: 12.5px; line-height: 1.5; }
.waitbar svg.i { margin-top: 2px; color: var(--tx-4); }
.waitbar .busy { color: var(--rev-bar); animation: ybreathe 1.4s ease-in-out infinite; }
.waitbar .wp { grid-column: 2; height: 3px; border-radius: 2px; background: var(--line-card); overflow: hidden; }
.waitbar .wp i { display: block; height: 100%; background: var(--done-bar); transition: width .3s; }

/* コンポーザ (PC の Composer: 本文 + 右下のボタン、下にメンションのチップとヒント) */
.composer { flex: none; padding: 4px 10px calc(10px + env(safe-area-inset-bottom)); }
.composer .box { display: flex; align-items: flex-end; gap: 4px; background: var(--bg-inset); border: 1px solid var(--line-card);
  border-radius: 24px; padding: 4px 4px 4px 16px; }
.composer .box:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-card)); }
.composer textarea { flex: 1; min-height: 40px; max-height: 128px; resize: none; border: 0; outline: 0; background: transparent;
  padding: 9px 0; font-size: 15.5px; line-height: 22px; color: var(--tx); }
.composer textarea::placeholder { color: var(--tx-4); }
.cbtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; flex: none; }
.cbtn.send { background: var(--accent); color: var(--on-accent); }
.cbtn.send:disabled { background: var(--bg-chip); color: var(--tx-5); }
.cbtn.stop { color: var(--hand-fg); border: 1px solid var(--line-card); }
.cbtn.stop svg { fill: currentColor; stroke: none; width: 13px; height: 13px; }
.crow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 4px 0; }
.crow:empty { display: none; }
.mchip { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; height: 30px; padding: 0 6px 0 8px; border-radius: 15px;
  background: var(--accent-soft); color: var(--accent); font: 500 12px/1 var(--font-mono); }
.mchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchip.new { animation: chipin .42s cubic-bezier(.3,1.5,.5,1); }
@keyframes chipin { 0% { transform: scale(.4); opacity: 0 } 60% { transform: scale(1.1); opacity: 1 } 100% { transform: none } }
.hint { display: inline-flex; align-items: center; gap: 5px; font: 11.5px/1.3 var(--font-mono); color: var(--tx-3); }

/* ---------- 左パネル ---------- */
#left .cols { flex: 1; min-height: 0; display: flex; }
/* アイコンレール: PC の .rail と同じ「コーディング / 履歴」+ 一番下に設定 */
.rail { width: 56px; flex: none; background: var(--bg-rail); padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rail-btn { position: relative; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--tx-4); }
.rail-btn:active { background: var(--bg-pressed); }
.rail-btn.active { background: var(--bg-chip); color: var(--accent); }
.rail-btn.active::before { content: ""; position: absolute; left: -6px; top: 13px; width: 3px; height: 18px; border-radius: 0 2px 2px 0; background: var(--accent); }
.rail .spacer { flex: 1; }
.side { flex: 1; min-width: 0; overflow-y: auto; padding-bottom: 12px; position: relative; display: flex; flex-direction: column; }
.side-label { display: flex; align-items: center; gap: 6px; padding: 14px 16px 6px; color: var(--tx-4); font-size: 12px; }
/* プロジェクトのドロップダウン (PC の ProjectPicker) */
.picker { position: relative; margin: 0 12px; }
.ptrigger { display: flex; align-items: center; gap: 10px; width: 100%; height: 46px; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--line-card); background: var(--bg-card); text-align: left; }
.ptrigger .name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptrigger .chev { color: var(--tx-4); transition: transform .15s; }
.ptrigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
.ppop { position: absolute; left: 0; right: 0; top: 50px; z-index: 30; background: var(--bg-card); border: 1px solid var(--line-card);
  border-radius: 12px; padding: 6px 0; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.popt { display: flex; align-items: center; gap: 10px; width: 100%; height: 48px; padding: 0 14px; text-align: left; color: var(--tx-body); font-size: 14.5px; }
.popt:active { background: var(--bg-pressed); }
.popt .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popt .check { color: var(--accent); }
/* バックグラウンドで動作中のプロジェクト (PC の BackgroundProjects) */
.bgp { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px 2px 16px; }
.bgp .cap { color: var(--done-bar); padding-top: 9px; flex: none; }
.bgp ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.bgchip { display: inline-flex; align-items: center; gap: 7px; height: 34px; max-width: 200px; padding: 0 12px 0 10px; border-radius: 17px;
  border: 1px solid var(--line-card); background: var(--bg-chip-dim); color: var(--tx-2); font-size: 13px; }
.bgchip:active { background: var(--bg-pressed); }
.bgchip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ブランチ (作業ツリー) とチャット (PC の BranchTree / ChatRow) */
.wt { display: flex; align-items: center; }
.wtrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 4px 0 12px; text-align: left; color: var(--tx-2); }
.wtrow .wcaret { color: var(--tx-4); transition: transform .15s; }
.wtrow[aria-expanded="false"] .wcaret { transform: rotate(-90deg); }
.wtrow .bname { flex: 1; min-width: 0; font: 12.5px/1.3 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt .add { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 20px; color: var(--tx-4); margin-right: 4px; flex: none; }
.chat { display: flex; align-items: center; gap: 10px; width: calc(100% - 16px); margin: 1px 8px; min-height: 42px; padding: 0 10px 0 30px;
  border-radius: 10px; text-align: left; color: var(--tx-2); }
.chat.sel { background: var(--bg-selected); color: var(--tx); }
.chat:active { background: var(--bg-pressed); }
.chat .ct { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .ago { font: 11px/1 var(--font-mono); color: var(--tx-4); }
.other { padding-left: 30px; }
.bform { margin: 2px 12px 10px; padding: 10px; border: 1px solid var(--line-card); border-radius: 12px; background: var(--bg-inset); display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.bform input, .bform select { height: 40px; min-width: 0; border-radius: 8px; border: 1px solid var(--line-card); background: var(--bg-center); padding: 0 10px; font: 13px var(--font-mono); outline: 0; }
.bform input { grid-column: 1 / -1; }
.bform .err { grid-column: 1 / -1; color: var(--hand-fg); font-size: 12.5px; }
.bform .ok { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--bg-chip); color: var(--tx); }
/* 下端: コアのホスト (PC の HostFooter) とプラン・使用量 (PC の StatusBar) */
.side-foot { flex: none; border-top: 1px solid var(--line); background: var(--bg-rail); padding: 9px 14px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 7px;
  font: 11.5px/1 var(--font-mono); color: var(--tx-3); }
.side-foot .host { display: flex; align-items: center; gap: 7px; }
.side-foot .host b { font-weight: 500; color: var(--tx-2); }
.side-foot .usage { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meter { display: inline-flex; align-items: center; gap: 5px; }
.meter .bar { width: 40px; height: 4px; border-radius: 2px; background: var(--line-card); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 2px; }
.meter .rs { display: inline-flex; align-items: center; gap: 2px; color: var(--tx-4); }
.sep { width: 1px; height: 12px; background: var(--line-card); }

/* ---------- 右パネル (PC の TaskColumn) ---------- */
.rhead { flex: none; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--line); color: var(--tx-3); }
.rhead .gchip { min-width: 0; max-width: 100%; height: 26px; padding: 0 10px; border-radius: 7px; background: var(--bg-chip); color: var(--tx); font-size: 13.5px;
  display: inline-flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhead .subs { display: inline-flex; align-items: center; gap: 4px; font: 12px/1 var(--font-mono); flex: none; }
.rbody { flex: 1; overflow-y: auto; padding: 10px 10px 24px 12px; }
.gbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 2px 2px 10px; font: 11.5px/1.3 var(--font-mono); color: var(--tx-3); }
.gbar .gid { color: var(--tx-2); font-weight: 500; }
.gbar .gbr { flex: 1 1 100%; order: 9; display: inline-flex; align-items: center; gap: 4px; min-width: 0; color: var(--tx-4); overflow: hidden; white-space: nowrap; }
.gbar .gbr span { overflow: hidden; text-overflow: ellipsis; }
.gbar .cnt { display: inline-flex; align-items: center; gap: 3px; }
.gbar .cnt.h { color: var(--hand-bar); }
.galert { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; padding: 9px 12px; border-radius: 10px;
  background: var(--hand-card-bg); border: 1px solid var(--hand-card-line); color: var(--hand-card-tx); font-size: 13px; line-height: 1.55; }
.galert svg.i { color: var(--hand-bar); }
.galert > span { flex: 1 1 220px; min-width: 0; }
.galert .btn { margin-left: auto; }
.gmeta { margin: -4px 2px 10px; font: 11.5px/1.4 var(--font-mono); color: var(--tx-4); }
.past > summary { list-style: none; display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 4px; color: var(--tx-3); font: 500 12px/1 var(--font-ui); }
.past > summary::-webkit-details-marker { display: none; }
.past > summary .chev { transition: transform .15s; transform: rotate(-90deg); }
.past[open] > summary .chev { transform: none; }
.past .pg { margin-top: 6px; }
/* タスクカード (PC の TaskCard)。右→左のスワイプで中身 (.slide) が指に付いてずれ、下の @ が見える */
.task { position: relative; border: 1px solid var(--line-card); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
.task .slide { position: relative; z-index: 1; display: grid; gap: 7px; padding: 8px 6px 9px 12px; background: var(--bg-card); will-change: transform; }
.task.c-handling { border-color: var(--hand-card-line); }
.task.c-handling .slide { background: var(--hand-card-bg); }
.task.c-done .slide, .task.c-cancelled .slide { background: var(--bg-inset); }
.task .th { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.task .tid { font: 500 11.5px/1 var(--font-mono); color: var(--tx-3); }
.task .tt { padding-right: 8px; font-size: 14.5px; line-height: 1.45; color: var(--tx); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: -4px; }
.task.c-done .tt, .task.c-cancelled .tt { color: var(--tx-4); }
.task.c-handling .tt { color: var(--hand-card-title); }
.task.c-handling .tid, .task.c-handling .log { color: var(--hand-card-meta); }
.task.c-handling .meta { color: var(--hand-card-meta-strong); }
.task.c-handling .iconbtn { color: var(--hand-card-icon); }
.task .iconbtn { color: var(--tx-3); }
.iconbtn svg.stopi { fill: currentColor; stroke: none; width: 12px; height: 12px; }
.prog { position: relative; height: 2px; margin-right: 6px; border-radius: 2px; background: var(--line-card); overflow: hidden; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; }
.prog b { position: absolute; top: 0; bottom: 0; width: 34%; animation: ysheen 1.9s ease-in-out infinite; }
.prog.implementing i { background: var(--impl-bar); } .prog.implementing b { background: linear-gradient(90deg, transparent, var(--impl-sheen), transparent); }
.prog.reviewing i { background: var(--rev-bar); } .prog.reviewing b { background: linear-gradient(90deg, transparent, var(--rev-sheen), transparent); }
.note { display: flex; gap: 7px; padding-right: 6px; font-size: 13.5px; line-height: 1.55; color: var(--hand-card-tx); }
.note svg.i { margin-top: 3px; color: var(--hand-card-icon); }
.log { display: grid; gap: 2px; padding-right: 6px; font: 11.5px/1.45 var(--font-mono); color: var(--tx-4); }
.log div { display: flex; align-items: center; gap: 6px; min-width: 0; }
.log span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tfoot { display: flex; align-items: center; gap: 8px; padding-right: 6px; font: 11.5px/1 var(--font-mono); color: var(--tx-4); }
.steps { display: flex; align-items: center; gap: 3px; list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; place-items: center; color: var(--tx-5); }
.steps li.done { color: var(--done-bar); }
.steps li.running.implementing, .steps li.running.waiting { color: var(--impl-bar); animation: ypulse 1.4s ease-in-out infinite; }
.steps li.running.reviewing { color: var(--rev-bar); animation: ypulse 1.4s ease-in-out infinite; }
.steps li.running.handling { color: var(--hand-bar); }
.steps .lk { width: 6px; height: 1px; background: var(--line-card); }
.tagent { display: inline-flex; align-items: center; gap: 4px; }
.meta { display: flex; align-items: center; gap: 6px; padding-right: 6px; font: 11.5px/1.4 var(--font-mono); color: var(--tx-4); }
.under { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px;
  background: color-mix(in srgb, var(--accent) 16%, var(--bg-panel)); opacity: 0; }
.under .at { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft);
  transform: scale(.8); transition: transform .18s cubic-bezier(.3,1.7,.5,1), background .15s, color .15s; }
.task.armed .under .at { transform: scale(1.18); background: var(--accent); color: var(--on-accent); }
.task.fired .under .at { animation: atfire .34s ease-out forwards; }
@keyframes atfire { 0% { transform: scale(1.18) } 45% { transform: scale(1.45) } 100% { transform: scale(1.1); opacity: .2 } }

/* ---------- 積み重ねの画面 (タスク詳細・設定) ---------- */
.screen { position: absolute; inset: 0; z-index: 40; background: var(--bg-center); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); visibility: hidden; box-shadow: -10px 0 30px rgba(0,0,0,.35); }
.screen.open { transform: none; visibility: visible; }
.screen.closing { visibility: visible; }
.screen-dim { position: absolute; inset: 0; z-index: 39; background: var(--sheet-scrim); opacity: 0; pointer-events: none; transition: opacity .26s; }
.screen-dim.on { opacity: 1; }
.dhead { flex: none; display: flex; align-items: center; gap: 2px; min-height: 60px; padding: 0 8px 0 4px; border-bottom: 1px solid var(--line); }
.dhead .titles { flex: 1; min-width: 0; padding: 8px 2px; }
.dhead .tid { display: flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--font-mono); color: var(--tx-4); }
.dhead .tt { font-size: 15.5px; font-weight: 600; color: var(--tx); line-height: 1.35; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dbody { flex: 1; overflow-y: auto; }
.stabs { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--bg-center); }
.stab { height: 34px; padding: 0 14px; border-radius: 17px; font: 500 12.5px/1 var(--font-mono); color: var(--tx-3); display: inline-flex; align-items: center; gap: 7px; flex: none;
  border: 1px solid var(--line-card); }
.stab.sel { background: var(--bg-chip); color: var(--tx); border-color: transparent; }
.stab .sdot { width: 8px; height: 8px; }
.results { display: grid; gap: 6px; padding: 10px 16px 4px; }
.result { display: flex; gap: 8px; font: 12px/1.55 var(--font-mono); color: var(--tx-3); }
.result svg.i { margin-top: 2px; color: var(--tx-4); }
.result .v.approve { color: var(--done-bar); } .result .v.needs_changes { color: var(--hand-bar); }
.dout { padding: 8px 0 32px; }
/* 設定 (PC の SettingsModal の項目。「リモート接続」は PC 専用なので出さない) */
.stabs2 { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.stabs2 button { height: 36px; padding: 0 14px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--tx-3); flex: none; border: 1px solid var(--line-card); }
.stabs2 button.sel { background: var(--bg-chip); color: var(--tx); border-color: transparent; }
.sbody { padding: 12px 14px 32px; display: grid; gap: 14px; }
.snote { font-size: 12.5px; line-height: 1.6; color: var(--tx-3); }
.scope { display: inline-flex; border: 1px solid var(--line-card); border-radius: 18px; overflow: hidden; justify-self: start; }
.scope button { height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tx-3); }
.scope button.sel { background: var(--accent-soft); color: var(--accent); }
.role { border: 1px solid var(--line-card); border-radius: 12px; overflow: hidden; }
.role .rh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg-inset); font-size: 14px; color: var(--tx); }
.role .rh small { color: var(--tx-4); font-size: 12px; }
.cand { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.cand .star { color: var(--tx-5); } .cand .star.on { color: var(--accent); }
.cand .m { font: 12.5px/1.4 var(--font-mono); color: var(--tx); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cand .memo { grid-column: 2 / 4; font-size: 12.5px; color: var(--tx-3); }
.cand .del { color: var(--tx-4); }
.addrow { display: flex; align-items: center; gap: 6px; width: 100%; height: 42px; padding: 0 12px; border-top: 1px solid var(--line); color: var(--tx-3); font-size: 13px; }
.inherit { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--tx-2); }
.hlist { display: grid; gap: 8px; }
.hitem { border: 1px solid var(--line-card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.hitem .hn { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tx); }
.hitem .hp { font: 11.5px/1.5 var(--font-mono); color: var(--tx-3); word-break: break-all; }
.sform { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.sform input { height: 42px; min-width: 0; border-radius: 10px; border: 1px solid var(--line-card); background: var(--bg-inset); padding: 0 10px; font: 13px var(--font-mono); outline: 0; }
.sform input:first-child { grid-column: 1 / -1; }

/* ---------- 通知の見本 (Android のヘッドアップ通知の見た目) ---------- */
.notif { position: fixed; left: 8px; right: 8px; top: calc(var(--mockbar) + 8px); z-index: 110; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
  padding: 12px 14px; border-radius: 22px; background: #2d2a27; color: var(--tx); box-shadow: 0 10px 30px rgba(0,0,0,.5);
  transform: translateY(-140%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s; text-align: left; }
.notif.show { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.notif .ap { grid-row: span 3; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 16px/1 var(--font-ui); }
.notif .src { font-size: 12px; color: var(--tx-3); }
.notif .nt { font-size: 14.5px; font-weight: 600; }
.notif .nbd { font-size: 13.5px; color: var(--tx-2); line-height: 1.45; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="mockbar"><span>モック · ダミーデータ</span><button type="button" id="mock-notify">通知の見本 ▶</button></div>
<div id="app">
  <aside id="left" class="panel" aria-label="プロジェクトとチャット"></aside>
  <aside id="right" class="panel" aria-label="tasks"></aside>
  <main id="center">
    <div id="shield"></div>
    <header class="topbar" id="topbar"></header>
    <div class="msgs" id="msgs"></div>
    <div id="waitbar-slot"></div>
    <div class="composer" id="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="オーケストレータに指示する…" aria-label="オーケストレータへのメッセージ"></textarea>
        <button class="cbtn stop" id="stop" aria-label="ターンを中止"></button>
        <button class="cbtn send" id="send" aria-label="送信"></button>
      </div>
      <div class="crow" id="crow"></div>
    </div>
  </main>
  <div class="screen-dim" id="screendim"></div>
  <section class="screen" id="detail" aria-label="エージェントの出力"></section>
  <section class="screen" id="settings" aria-label="設定"></section>
  <div class="edge-hint left" id="edgeL"><span>端 = 戻る</span></div>
  <div class="edge-hint right" id="edgeR"><span>端 = 戻る</span></div>
</div>
<button type="button" class="notif" id="notif" aria-live="polite"></button>

<script>

/* ======================= 小さな Markdown (見出し・リスト・表・コード・強調・インラインコード) ======================= */
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code class="inl">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function renderMd(src) {
  const L = src.split('\n'); let i = 0, h = '';
  const isBlockStart = l => /^(~~~|```)|^#{1,3} |^\||^\s*([-*]|\d+\.) /.test(l);
  while (i < L.length) {
    const l = L[i];
    if (/^(~~~|```)/.test(l)) {
      const lang = l.slice(3).trim(), buf = []; i++;
      while (i < L.length && !/^(~~~|```)/.test(L[i])) buf.push(L[i++]);
      i++;
      h += `<div class="code">${lang ? `<div class="lang">${esc(lang)}</div>` : ''}<pre class="hscroll"><code>${esc(buf.join('\n'))}</code></pre></div>`;
    } else if (/^#{1,3} /.test(l)) {
      const n = l.match(/^#+/)[0].length; h += `<h${n + 2}>${inline(l.slice(n + 1))}</h${n + 2}>`; i++;
    } else if (/^\|/.test(l)) {
      const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      h += `<div class="tablewrap hscroll"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>` +
        body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
    } else if (/^\s*([-*]|\d+\.) /.test(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && /^\s*([-*]|\d+\.) /.test(L[i])) items.push(L[i++].replace(/^\s*([-*]|\d+\.) /, ''));
      const t = ordered ? 'ol' : 'ul'; h += `<${t}>${items.map(x => `<li>${inline(x)}</li>`).join('')}</${t}>`;
    } else if (!l.trim()) { i++; }
    else {
      const buf = []; while (i < L.length && L[i].trim() && !isBlockStart(L[i])) buf.push(L[i++]);
      h += `<p>${buf.map(inline).join('<br>')}</p>`;
    }
  }
  return h;
}

}
const toneIcon = t => tone(t) === 'implementing' && t.kind === 'investigate' ? 'search' : TONE_ICON[tone(t)];

/* ======================= 画面の積み重ねと「戻る」 =======================
   状態 = { panel: null|'left'|'right', screen: null|'detail'|'settings', task }。開くたびに history に積む。
   戻る (Android の戻る = ブラウザの戻る、モックでは Esc も) は 1 段ずつ閉じる: 詳細 → パネル → 中央。 */
let nav = {panel: null, screen: null, task: null, depth: 0};
const historyOk = (() => { try { history.replaceState({panel: null, screen: null, task: null, depth: 0}, ''); return true; } catch { return false; } })();
function pushNav(next) {
  next = Object.assign({}, nav, next, {depth: nav.depth + 1});
  if (historyOk) history.pushState(next, '');
  applyNav(next);
}
function back(steps = 1) {
  if (nav.depth <= 0) return;
  steps = Math.min(steps, nav.depth);
  if (historyOk) history.go(-steps);
  else applyNav(steps >= nav.depth ? {panel: null, screen: null, task: null, depth: 0} : Object.assign({}, nav, nav.screen ? {screen: null, depth: nav.depth - 1} : {panel: null, depth: nav.depth - 1}));
}
window.addEventListener('popstate', e => applyNav(e.state || {panel: null, screen: null, task: null, depth: 0}));
function applyNav(next) {
  const prev = nav; nav = next;
  const W = panelW(), target = next.panel === 'left' ? W : next.panel === 'right' ? -W : 0;
  if (target !== pos) setPos(target, 240);
  if (next.panel === 'right') renderRight();
  if (next.panel !== 'left' && ui.picker) { ui.picker = false; renderLeft(); }
  for (const id of ['detail', 'settings']) {
    const el = $(id), want = next.screen === id;
    if (want && (!el.classList.contains('open') || prev.task !== next.task)) {
      if (id === 'detail') { if (prev.task !== next.task) ui.detailTab = null; renderDetail(next.task); $('detail').querySelector('.dbody').scrollTop = 0; }
      else renderSettings();
      el.classList.add('open');
    } else if (!want && el.classList.contains('open')) {
      el.classList.remove('open'); el.classList.add('closing');
      setTimeout(() => el.classList.remove('closing'), 280);
    }
  }
  $('screendim').classList.toggle('on', !!next.screen);
}

/* ======================= パネルの位置 ======================= */
const app = $('app'), center = $('center'), shield = $('shield');
const PEEK = 64;
let pos = 0;
const panelW = () => app.clientWidth - PEEK;
function setPos(x, ms) {
  center.style.transition = ms ? `transform ${ms}ms cubic-bezier(.2,.8,.2,1)` : 'none';
  center.style.transform = x ? `translate3d(${x}px,0,0)` : '';
  pos = x;
  const W = panelW();
  if (x > 0) app.dataset.reveal = 'left'; else if (x < 0) app.dataset.reveal = 'right';
  center.classList.toggle('shifted', x !== 0 || !!ms && app.dataset.reveal);
  shield.style.opacity = Math.min(1, Math.abs(x) / W);
  if (x === 0) {
    const done = () => { if (pos === 0) { app.dataset.reveal = ''; center.classList.remove('shifted'); } };
    if (ms) setTimeout(done, ms + 20); else done();
  }
}
window.addEventListener('resize', () => { const W = panelW(); setPos(nav.panel === 'left' ? W : nav.panel === 'right' ? -W : 0, 0); });

/* ======================= ジェスチャ =======================
   1. 画面の左右 24px から始まったタッチは Android の「戻る」ジェスチャ用として無視する (端を光らせて知らせる)。
   2. 横にスクロールできる要素 (.hscroll: コードブロック・表・セッションのタブ) の上で、実際にはみ出していれば、その要素のスクロールを優先する。
   3. 最初の 10px の向きで決める。縦なら縦スクロールに固定し、その指では横に切り替えない。
   4. 横に決まったら、始めた場所と向きで 1 つを選ぶ (以後その指では変えない):
      - タスク詳細が開いている: 右向き (左→右) = 詳細を閉じるドラッグ。左向きは何もしない。
      - 右パネルが開いていて、タスクカードの上で始めた: 左向き (右→左) = カードのメンションスワイプ。右向きはパネルを閉じるドラッグ。
      - それ以外: パネルのドラッグ (1 回で動けるのは今の位置から隣まで)。
   5. 離したとき: パネルと詳細は、速度が 0.35px/ms を超えていればその向きへ、そうでなければ近い方 (詳細は幅の 35%) へ。
      カードは 88px を超えていれば (または 40px 以上で 0.45px/ms 超のフリック) メンションを確定、足りなければ戻る。 */
const EDGE = 24, SLOP = 10, FLING = 0.35, ROW_ARM = 88, ROW_MAX = 132, ROW_FLING = 0.45, ROW_FLING_MIN = 40, DETAIL_CLOSE = 0.35;
let g = null, suppressClick = false;
function flashEdge(side) {
  const el = side === 'left' ? $('edgeL') : $('edgeR');
  el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 650);
}
function velocity(samples) {
  const a = samples[0], b = samples[samples.length - 1];
  return b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0;
}
app.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (g) return;
  const r = app.getBoundingClientRect(), x = e.clientX - r.left;
  if (x < EDGE || x > r.width - EDGE) { g = {id: e.pointerId, mode: 'edge'}; flashEdge(x < EDGE ? 'left' : 'right'); return; }
  const hs = e.target.closest('.hscroll');
  if (hs && hs.scrollWidth > hs.clientWidth + 1) {
    g = {id: e.pointerId, mode: 'native', el: hs, sx: e.clientX, sl: hs.scrollLeft, mouse: e.pointerType === 'mouse'};
    return;
  }
  if (e.target.closest('textarea, input, select, .ppop')) return;
  const ctx = nav.screen === 'detail' ? 'detail' : nav.screen ? null : 'panel';
  if (!ctx) return;
  const row = ctx === 'panel' && nav.panel === 'right' ? e.target.closest('#right .task') : null;
  g = {id: e.pointerId, mode: 'pending', ctx, row, sx: e.clientX, sy: e.clientY, base: pos, dx: 0, samples: [[e.timeStamp, e.clientX]], mouse: e.pointerType === 'mouse'};
});
app.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  if (g.mode === 'native') { if (g.mouse) { g.el.scrollLeft = g.sl - (e.clientX - g.sx); if (Math.abs(e.clientX - g.sx) > 4) suppressClick = true; } return; }
  if (g.mode === 'pending') {
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if (Math.hypot(dx, dy) < SLOP) return;
    if (Math.abs(dx) <= Math.abs(dy)) { g.mode = 'vertical'; return; }
    g.mode = g.ctx === 'detail' ? (dx > 0 ? 'detail' : 'none') : g.row && dx < 0 ? 'row' : 'drag';
    if (g.mode === 'none') return;
    g.sx = e.clientX;                        // スロップ分を飛ばさない (指の下から動き始める)
    try { app.setPointerCapture(e.pointerId); } catch {}
    app.classList.add('dragging');
    if (g.mode === 'row') g.slide = g.row.querySelector('.slide');
    if (g.mode === 'detail') { g.el = $('detail'); g.el.style.transition = 'none'; $('screendim').style.transition = 'none'; }
  }
  if (g.mode === 'none' || g.mode === 'vertical' || g.mode === 'edge') return;
  g.samples.push([e.timeStamp, e.clientX]);
  while (g.samples.length > 2 && e.timeStamp - g.samples[0][0] > 100) g.samples.shift();
  const raw = e.clientX - g.sx;
  if (g.mode === 'drag') {
    const W = panelW();
    const lo = g.base > 0 || ui.view === 'runs' ? 0 : -W, hi = g.base < 0 ? 0 : W;
    setPos(Math.max(lo, Math.min(hi, g.base + raw)), 0);
  } else if (g.mode === 'row') {
    let dx = Math.min(0, raw);
    if (dx < -ROW_MAX) dx = -ROW_MAX - (-dx - ROW_MAX) * 0.25;   // 先はゴムのように重くする
    g.dx = dx;
    g.slide.style.transition = 'none';
    g.slide.style.transform = `translate3d(${dx}px,0,0)`;
    g.row.querySelector('.under').style.opacity = Math.min(1, -dx / 36);
    g.row.classList.toggle('armed', -dx >= ROW_ARM);
  } else if (g.mode === 'detail') {
    const dx = Math.max(0, raw);
    g.dx = dx;
    g.el.style.transform = `translate3d(${dx}px,0,0)`;
    $('screendim').style.opacity = String(1 - dx / app.clientWidth);
  }
});
function endGesture(e) {
  if (!g || e.pointerId !== g.id) return;
  const was = g; g = null;
  app.classList.remove('dragging');
  if (was.mode === 'native' && was.mouse && suppressClick) setTimeout(() => suppressClick = false, 0);
  if (!['drag', 'row', 'detail'].includes(was.mode)) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 0);
  const v = e.type === 'pointercancel' ? 0 : velocity(was.samples);
  if (was.mode === 'row') return finishRow(was.row, was.slide, -was.dx >= ROW_ARM || (v < -ROW_FLING && -was.dx >= ROW_FLING_MIN));
  if (was.mode === 'detail') return finishDetail(was.el, was.dx, was.dx > app.clientWidth * DETAIL_CLOSE || v > FLING, v);
  const W = panelW();
  const snaps = [-W, 0, W].filter(p => p >= (was.base > 0 || ui.view === 'runs' ? 0 : -W) && p <= (was.base < 0 ? 0 : W));
  let target;
  if (Math.abs(v) > FLING) target = v > 0 ? (snaps.find(p => p > pos + 0.5) ?? snaps[snaps.length - 1]) : ([...snaps].reverse().find(p => p < pos - 0.5) ?? snaps[0]);
  else target = snaps.reduce((best, p) => Math.abs(p - pos) < Math.abs(best - pos) ? p : best, snaps[0]);
  const dist = Math.abs(target - pos), ms = Math.max(120, Math.min(300, dist / Math.max(Math.abs(v), 1.1)));
  setPos(target, ms);
  const panel = target > 0 ? 'left' : target < 0 ? 'right' : null;
  if (panel !== nav.panel) {
    if (panel && !nav.panel) { if (panel === 'right') renderRight(); pushNav({panel}); }

  }
}
app.addEventListener('pointerup', endGesture);
app.addEventListener('pointercancel', endGesture);   // 縦スクロールが始まるとブラウザが cancel を送る
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
shield.addEventListener('click', () => { if (nav.panel) back(); });

// カードのスワイプの終わり: 確定なら @ が弾んでからカードが戻り、メンションを積んで中央へ。足りなければ戻るだけ
function finishRow(row, slide, confirm) {
  const id = row.dataset.task, under = row.querySelector('.under');
  slide.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)';
  if (confirm) {
    row.classList.add('armed', 'fired');
    setTimeout(() => { slide.style.transform = ''; under.style.transition = 'opacity .24s'; under.style.opacity = '0'; }, 120);
    setTimeout(() => { addMention(id); toCenter(); }, 300);
  } else {
    slide.style.transform = ''; under.style.transition = 'opacity .2s'; under.style.opacity = '0';
  }
  setTimeout(() => { row.classList.remove('armed', 'fired'); slide.style.transition = ''; under.style.transition = ''; }, 420);
}
// 詳細を閉じるスワイプの終わり: 指を離した位置と速度で閉じる / 戻る
function finishDetail(el, dx, close, v) {
  const W = app.clientWidth, dim = $('screendim');
  const ms = close ? Math.max(140, Math.min(280, (W - dx) / Math.max(v, 1.2))) : 220;
  el.style.transition = `transform ${ms}ms cubic-bezier(.2,.8,.2,1)`;
  dim.style.transition = `opacity ${ms}ms`;
  if (close) { el.style.transform = 'translate3d(100%,0,0)'; dim.style.opacity = '0'; back(); }
  else { el.style.transform = 'translate3d(0,0,0)'; dim.style.opacity = '1'; }
  setTimeout(() => { el.style.transition = el.style.transform = dim.style.transition = dim.style.opacity = ''; }, ms + 40);
}

/* ======================= 操作 (PC にあるものだけ) ======================= */
function addMention(id) {
  const t = TASKS[id];
  if (!ui.mentions.some(m => m.task === id)) {
    ui.mentions.push({task: id, title: t.title}); ui.newMention = id;
    setTimeout(() => { if (ui.newMention === id) ui.newMention = null; }, 500);
  }
  renderComposer();
}
function toCenter() { if (nav.depth) back(nav.depth); }
function selectChat(id) {
  const c = CHATS[id];
  ui.chatId = id; ui.projectId = c.project; c.unread = false; ui.mentions = [];
  renderLeft(); renderCenter(); $('msgs').scrollTop = $('msgs').scrollHeight; renderRight();
}
function switchProject(pid) {
  const p = PROJECTS.find(q => q.id === pid); p.open = true; ui.picker = false;
  if (pid === ui.projectId) { renderLeft(); return; }
  const latest = chatsOf(pid).sort((a, b) => ageRank(a.ago) - ageRank(b.ago))[0];
  ui.projectId = pid; ui.branchForm = false; ui.otherOpen = false;
  selectChat(latest.id);
}
let chatSeq = 30;
function newChat(pid, wt) {
  const id = 'C-' + (chatSeq++);
  C({id, project: pid, wt, title: null, ago: 'now', session: 'stopped'});
  ui.wtOpen[pid + ':' + wt] = true;
  selectChat(id); toCenter(); setTimeout(() => $('input').focus(), 300);
}
function cancelTask(id, why) {
  const t = TASKS[id]; if (isTerminal(t)) return;
  t.status = 'cancelled'; t.cancel_reason = why; t.helps = [];
  t.steps.forEach(s => { if (s.status === 'running') s.status = 'pending'; });
  Object.values(t.sessions).forEach(s => { s.state = 'ended'; s.items = s.items.filter(x => x.type !== 'live'); });
}
document.addEventListener('click', e => {
  if (ui.picker && !e.target.closest('#picker')) { ui.picker = false; renderLeft(); if (!e.target.closest('[data-act]')) return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'open-left': pushNav({panel: 'left'}); break;
    case 'open-right': renderRight(); pushNav({panel: 'right'}); break;
    case 'view': ui.view = el.dataset.v; renderLeft(); renderCenter(); renderRight(); break;
    case 'picker': ui.picker = !ui.picker; renderLeft(); break;
    case 'project': switchProject(el.dataset.id); break;
    case 'chat': selectChat(el.dataset.id); back(); break;
    case 'toggle-wt': { const k = el.dataset.key; ui.wtOpen[k] = el.getAttribute('aria-expanded') !== 'true'; renderLeft(); break; }
    case 'toggle-others': ui.otherOpen = !ui.otherOpen; renderLeft(); break;
    case 'newchat': newChat(ui.projectId, +el.dataset.wt); break;
    case 'newchat-branch': {
      const p = project(), b = el.dataset.branch;
      p.otherBranches = p.otherBranches.filter(x => x !== b); p.worktrees.push({branch: b});
      newChat(p.id, p.worktrees.length - 1); break;
    }
    case 'branch-new': ui.branchForm = !ui.branchForm; ui.branchErr = ''; renderLeft(); if (ui.branchForm) setTimeout(() => $('bname')?.focus(), 50); break;
    case 'settings': pushNav({screen: 'settings'}); break;
    case 'stab': ui.settingsTab = el.dataset.k; renderSettings(); break;
    case 'scope': ui.scope = el.dataset.k; renderSettings(); break;
    case 'toggle': { const k = el.dataset.key; openKeys.has(k) ? openKeys.delete(k) : openKeys.add(k);
      if (k.startsWith('d:')) renderDetail(nav.task); else renderMsgs(false); break; }
    case 'toggle-past': e.preventDefault(); openKeys.has('past') ? openKeys.delete('past') : openKeys.add('past'); renderRight(); break;
    case 'task': pushNav({screen: 'detail', task: el.dataset.id}); break;
    case 'dtab': ui.detailTab = el.dataset.k; renderDetail(nav.task); break;
    case 'back': back(); break;
    case 'mention': addMention(el.dataset.id); toCenter(); break;
    case 'unmention': ui.mentions = ui.mentions.filter(m => m.task !== el.dataset.id); renderComposer(); break;
    // ■ = エージェントを停止 (タスクを中止)。PC と同じく確認なし。オーケストレータへはユーザー操作として届く
    case 'cancel-task': {
      const t = TASKS[el.dataset.id]; cancelTask(t.id, 'ユーザーが中止');
      const c = CHATS[GROUPS[t.group].chat]; c.msgs.splice(lastIndex(c), 0, ytool('cancel_task', `${t.id} · ユーザーが中止`, true, 'user'));
      renderRight(); renderCenter(false); break;
    }
    case 'cancel-group': {
      const gr = GROUPS[el.dataset.id]; tasksOf(gr.id).forEach(t => cancelTask(t.id, 'グループを中止')); gr.status = 'cancelled';
      const c = CHATS[gr.chat]; c.msgs.splice(lastIndex(c), 0, ytool('cancel_group', `${gr.id} · ユーザーが中止`, true, 'user'));
      renderRight(); renderCenter(false); break;
    }
    case 'retry-merge': retryMerge(el.dataset.id); break;
  }
});
// ストリーミング中の発話の前に差し込む (末尾が流れている途中ならその前)
const lastIndex = c => c.msgs.length && c.msgs[c.msgs.length - 1].type === 'live' ? c.msgs.length - 1 : c.msgs.length;
document.addEventListener('submit', e => {
  if (e.target.id !== 'bform') return; e.preventDefault();
  const name = $('bname').value.trim(), p = project();
  if (!name) return;
  if (!/^[\w.\-/]+$/.test(name) || name.endsWith('/')) { ui.branchErr = `'${name}' is not a valid branch name`; renderLeft(); $('bname').value = name; return; }
  if (p.worktrees.some(w => w.branch === name) || p.otherBranches.includes(name)) { ui.branchErr = `a branch named '${name}' already exists`; renderLeft(); $('bname').value = name; return; }
  p.worktrees.push({branch: name}); ui.branchForm = false;
  newChat(p.id, p.worktrees.length - 1);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') back();
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.id === 'input') { e.preventDefault(); send(); }
});

/* ======================= コンポーザ (送信 / 中止 / 応答の真似) ======================= */
const input = $('input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(128, input.scrollHeight) + 'px'; renderComposer(); });
$('send').addEventListener('click', () => send());
$('stop').addEventListener('click', () => stopTurn(ui.chatId));
const timers = {};
const later = (id, ms, fn) => (timers[id] = timers[id] || []).push(setTimeout(fn, ms));
function send() {
  const body = input.value.trim(); if (!body) return;
  const c = chat();
  const text = ui.mentions.length ? `${ui.mentions.map(m => `@${m.task} ${m.title}`).join('\n')}\n\n${body}` : body;
  const m = user(text);
  if (!c.title) c.title = body.slice(0, 24);
  c.ago = 'now'; input.value = ''; input.style.height = ''; ui.mentions = [];
  c.msgs.splice(lastIndex(c), 0, m);
  if (chatRunning(c)) { m.queued = true; c.queue.push(m); }   // ターン中: 受信箱で待ち、ターン終了後に届く
  else startReply(c);
  renderCenter(); $('msgs').scrollTop = $('msgs').scrollHeight; renderLeft();
}
function startReply(c) {
  const cold = c.session === 'stopped';
  c.session = cold ? 'starting' : 'running';
  const id = c.id, delay = cold ? 1600 : 400;
  const reply = ['受け取りました。**これはモックの返答** です。PC にはつながっていません。', '', '- 実際にはここにオーケストレータの返事が Markdown で流れてきます', '- ツール呼び出しは控えめな 1 行で出ます'].join('\n');
  later(id, delay, () => { c.session = 'running'; c.msgs.push(tool('Read README.md', 'in_progress')); refresh(id); });
  later(id, delay + 900, () => { c.msgs[c.msgs.length - 1].status = 'completed'; c.msgs.push({type: 'live', text: ''}); refresh(id); });
  const chars = [...reply]; let n = 0;
  const tick = () => {
    n = Math.min(chars.length, n + 3);
    c.msgs[c.msgs.length - 1].text = chars.slice(0, n).join('');
    refresh(id);
    if (n < chars.length) later(id, 28, tick);
    else { c.msgs[c.msgs.length - 1].type = 'md'; turnEnded(c, 'end_turn'); }
  };
  later(id, delay + 1100, tick);
}
function stopTurn(id) {
  (timers[id] || []).forEach(clearTimeout); timers[id] = [];
  const c = CHATS[id], last = c.msgs[c.msgs.length - 1];
  if (last && last.type === 'live') { if (last.text) last.type = 'md'; else c.msgs.pop(); }
  c.msgs.forEach(m => { if (m.type === 'tool' && m.status === 'in_progress') m.status = 'failed'; });
  c.msgs.push({type: 'turn', outcome: 'cancelled'});
  turnEnded(c, 'cancelled');
}
// ターンの終わり: 受信箱に溜まった送信があれば次のターンへ。無ければ「作業全体の完了」かを見て通知する
function turnEnded(c, outcome) {
  c.session = 'ready';
  if (c.queue.length) { c.queue.forEach(m => delete m.queued); c.queue = []; startReply(c); }
  else if (outcome === 'end_turn' && isWorkComplete(c) && c.id !== ui.chatId) notify(c);
  refresh(c.id); renderLeft(); if (nav.panel === 'right') renderRight();
}
// 作業全体の完了 (案): ターンが正常に終わり、受信箱が空で、そのチャットに終わっていないグループ (active / finishing / merge_blocked) が無い
const isWorkComplete = c => c.session === 'ready' && !c.queue.length && !groupsOf(c.id).some(g => isOpenGroup(g) || g.status === 'merge_blocked');
function refresh(id) { if (id === ui.chatId) { renderMsgs(); renderComposer(); renderTopbar(); renderWaitbar(); } }

// マージの再試行 (merge_blocked のグループ。PC の TaskColumn にある)
function retryMerge(gid) {
  const gr = GROUPS[gid], c = CHATS[gr.chat];
  gr.status = 'finishing'; delete gr.detail; renderRight(); renderCenter(false);
  later(c.id, 1400, () => {
    gr.status = 'done';
    c.session = 'running';
    c.msgs.push(notice('merge_result', `group=${gid} ok=true`, `yhtye/${gid} を ${gr.base} にマージしました`));
    refresh(c.id); renderLeft(); if (nav.panel === 'right') renderRight();
  });
  later(c.id, 2600, () => {
    c.msgs.push(md(`${gid} (${gr.title}) を \`${gr.base}\` にマージしました。銀行丸めへの統一とテストの追加が入っています。`));
    turnEnded(c, 'end_turn');
  });
}

/* ======================= 通知 (作業全体の完了だけ。help / checkpoint では出さない) ======================= */
function notify(c) {
  const p = PROJECTS.find(q => q.id === c.project), el = $('notif');
  el.innerHTML = `<span class="ap">Y</span><span class="src">Yhtye · ${esc(p.name)} · 今</span>
    <span class="nt">${esc(c.title || NEW_CHAT_TITLE)} の作業が完了しました</span><span class="nbd">${esc(lastSummary(c))}</span>`;
  el.dataset.chat = c.id; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 6000);
}
const lastSummary = c => (([...c.msgs].reverse().find(m => m.type === 'md') || {text: ''}).text.split('\n')[0]).replace(/[*`]/g, '').slice(0, 80);
$('notif').addEventListener('click', () => {
  const el = $('notif'); el.classList.remove('show');
  const id = el.dataset.chat; if (!id) return;
  ui.view = 'work'; selectChat(id); toCenter();
});
// モックのボタン: C-5 のオーケストレータが G-11 を完了 (マージ) してターンを終える → 通知。
// 表示中のチャットでも見本として出す (実際は表示中なら出さない案)。
$('mock-notify').addEventListener('click', () => {
  const c = CHATS['C-5'], gr = GROUPS['G-11'];
  if (gr.status !== 'active') { notify(c); return; }
  c.session = 'running'; refresh(c.id); renderLeft();
  later(c.id, 700, () => { c.msgs.push(ytool('finish_group', 'G-11 → feat/checkout-refactor')); gr.status = 'finishing'; refresh(c.id); if (nav.panel === 'right') renderRight(); });
  later(c.id, 1900, () => { gr.status = 'done'; c.msgs.push(notice('merge_result', 'group=G-11 ok=true', 'yhtye/G-11 を feat/checkout-refactor にマージしました')); refresh(c.id); if (nav.panel === 'right') renderRight(); });
  later(c.id, 2600, () => {
    c.msgs.push(md('G-11 (webhook 再送の整理) を `feat/checkout-refactor` にマージしました。再送は指数バックオフ (最大 1 時間) になり、重複イベントの除外は T-105 に含めています。'));
    c.session = 'ready'; refresh(c.id); renderLeft();
    if (isWorkComplete(c)) notify(c);
  });
});

// 最初から走っている C-7 のターン: 少し進めてから、作業中のまま (中止ボタンを試せるように)
(function initialTurn() {
  const c = CHATS['C-7'];
  const text = ['`order.ts` の `OrderV2` を deprecated にして、v3 の型から v2 の形を作る変換を足しています。', '', '~~~ts', 'export const toOrderV2 = (o: OrderV3): OrderV2 => ({ total: Number(o.total.amount), currency: "JPY" })  // T-110 のレガシー側はこれを使う', '~~~', '', '終わったら T-110 に「v3 に合わせる、レガシーは `toOrderV2` を通す」と返答して再開させます。'].join('\n');
  const chars = [...text]; let n = 0;
  const tick = () => {
    n = Math.min(chars.length, n + 2);
    c.msgs[c.msgs.length - 1].text = chars.slice(0, n).join('');
    refresh('C-7');
    if (n < chars.length) later('C-7', 45, tick);
  };
  later('C-7', 1200, tick);
})();

renderLeft(); renderCenter(); renderRight();
$('msgs').scrollTop = $('msgs').scrollHeight;
</script>
</body>
