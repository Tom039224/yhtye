<!doctype html>
<!--
  Yhtye Android クライアントの GUI モック (段階 3 の前に画面構成とジェスチャの感触を確かめるためのもの)。
  1 ファイル完結: 外部の CSS / JS / フォント / 画像を読まない。データはすべてダミー。
  仕様の出どころ: docs/planned/android-client.md、docs/design/orchestrator-desktop.md §3.3-3.5 / §9、
  docs/architecture/orchestration-model.md。色は docs/design/tokens.md (ダーク) とそれに合わせたライト。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Yhtye モバイル モック</title>
<style>
/* ---------- トークン ---------- */
:root {
  --font-ui: system-ui, "Noto Sans JP", "Hiragino Sans", "Roboto", sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", "Roboto Mono", "Menlo", monospace;
  --peek: 64px;          /* パネルが開いたとき中央が見えている幅 */
  --mockbar: 20px;
}
/* ダーク: tokens.md の値 (暖色寄りのグレー) */
[data-theme="dark"] {
  --bg-app: #141312;
  --bg-center: #1e1d1b;
  --bg-panel: #1b1a18;
  --bg-rail: #141312;
  --bg-card: #23211f;
  --bg-inset: #1a1917;
  --bg-selected: #2c2824;
  --bg-chip: #2b2825;
  --bg-chip-dim: #232120;
  --bg-pressed: #33302b;
  --line: #2a2724;
  --line-card: #34302b;
  --line-dashed: #3a352f;
  --tx: #e8e5df;
  --tx-body: #ddd9d2;
  --tx-2: #b5afa5;
  --tx-3: #9a948a;
  --tx-4: #7d776e;
  --tx-5: #57524b;
  --accent: #d9a066;
  --accent-strong: #e0a45c;
  --on-accent: #1e1a15;
  --accent-soft: color-mix(in srgb, #d9a066 14%, transparent);
  --bubble-bg: color-mix(in srgb, #d9a066 13%, #1e1d1b);
  --bubble-line: color-mix(in srgb, #d9a066 28%, #1e1d1b);
  --impl-fg: oklch(0.86 0.07 250); --impl-bg: oklch(0.35 0.06 250); --impl-bar: oklch(0.66 0.11 250);
  --rev-fg: oklch(0.87 0.06 300);  --rev-bg: oklch(0.36 0.05 300);  --rev-bar: oklch(0.66 0.11 300);
  --hand-fg: oklch(0.93 0.05 40);  --hand-bg: oklch(0.42 0.13 30);  --hand-bar: oklch(0.58 0.14 30);
  --done-fg: oklch(0.85 0.09 150); --done-bg: oklch(0.33 0.05 150); --done-bar: oklch(0.72 0.13 150);
  --wait-fg: #9a948a; --wait-bg: #2b2825; --wait-bar: #57524b;
  --cancel-fg: #7d776e; --cancel-bg: #232120; --cancel-bar: #3a3733;
  --hand-card-bg: oklch(0.23 0.03 30); --hand-card-line: oklch(0.4 0.09 30);
  --hand-card-tx: #d8c4b4; --hand-card-title: #f0e7df; --hand-card-meta: #bfa48f;
  --usage-5h: oklch(0.7 0.14 55); --usage-week: oklch(0.72 0.11 150);
  --ring-run: oklch(0.75 0.15 150); --ring-track: oklch(0.72 0.13 150 / .28); --ring-stop: #4a453f;
  --code-bg: #161514;
  --shadow: 0 0 0 1px #2a2724, -8px 0 24px rgba(0,0,0,.45), 8px 0 24px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.35);
  --sheet-scrim: rgba(0,0,0,.5);
}
/* ライト: デザインはダーク一本なので、同じ色相で明度を反転して作った (発明した値) */
[data-theme="light"] {
  --bg-app: #ebe7e1;
  --bg-center: #fbfaf8;
  --bg-panel: #f4f1ec;
  --bg-rail: #e7e2db;
  --bg-card: #ffffff;
  --bg-inset: #f1eee9;
  --bg-selected: #e6dfd4;
  --bg-chip: #e8e2d9;
  --bg-chip-dim: #efebe5;
  --bg-pressed: #ddd6cb;
  --line: #e2ddd5;
  --line-card: #d8d1c6;
  --line-dashed: #cfc6b9;
  --tx: #23201c;
  --tx-body: #2c2823;
  --tx-2: #57514a;
  --tx-3: #6f685e;
  --tx-4: #8a8277;
  --tx-5: #aaa298;
  --accent: #a8641f;
  --accent-strong: #9a5a17;
  --on-accent: #fffaf3;
  --accent-soft: color-mix(in srgb, #c27a30 14%, transparent);
  --bubble-bg: color-mix(in srgb, #c98a45 14%, #fbfaf8);
  --bubble-line: color-mix(in srgb, #c98a45 32%, #fbfaf8);
  --impl-fg: oklch(0.42 0.11 250); --impl-bg: oklch(0.93 0.035 250); --impl-bar: oklch(0.6 0.13 250);
  --rev-fg: oklch(0.43 0.11 300);  --rev-bg: oklch(0.93 0.035 300);  --rev-bar: oklch(0.6 0.13 300);
  --hand-fg: oklch(0.45 0.14 32);  --hand-bg: oklch(0.92 0.045 40);  --hand-bar: oklch(0.6 0.16 30);
  --done-fg: oklch(0.43 0.1 150);  --done-bg: oklch(0.93 0.04 150);  --done-bar: oklch(0.62 0.13 150);
  --wait-fg: #6f685e; --wait-bg: #e8e2d9; --wait-bar: #b3aba0;
  --cancel-fg: #8a8277; --cancel-bg: #efebe5; --cancel-bar: #cfc8bd;
  --hand-card-bg: oklch(0.965 0.02 40); --hand-card-line: oklch(0.83 0.07 32);
  --hand-card-tx: #5b4334; --hand-card-title: #3d2a1e; --hand-card-meta: #8a6a56;
  --usage-5h: oklch(0.64 0.15 55); --usage-week: oklch(0.6 0.12 150);
  --ring-run: oklch(0.6 0.15 150); --ring-track: oklch(0.6 0.13 150 / .25); --ring-stop: #b9b1a6;
  --code-bg: #f1eee9;
  --shadow: 0 0 0 1px #ddd6cb, -8px 0 22px rgba(60,40,20,.16), 8px 0 22px rgba(60,40,20,.16);
  --scrim: rgba(40,30,20,.12);
  --sheet-scrim: rgba(30,20,10,.35);
}

/* ---------- 土台 ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* 横スワイプはアプリが扱う: 既定ではブラウザに縦のパンだけ任せる。横にスクロールできる要素は下で上書きする */
* { touch-action: pan-y; }
.hscroll, .hscroll * { touch-action: pan-x pan-y; }
html, body { margin: 0; height: 100%; background: var(--bg-app); color: var(--tx-body);
  font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; display: block; }
svg.i.s16 { width: 16px; height: 16px; } svg.i.s14 { width: 14px; height: 14px; } svg.i.s24 { width: 24px; height: 24px; }
.spin { animation: yspin .9s linear infinite; }
@keyframes yspin { to { transform: rotate(360deg); } }
@keyframes ypulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@keyframes ysheen { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
@keyframes caret { 50% { opacity: 0 } }

/* ---------- モック表示 ---------- */
#mockbar { position: fixed; top: 0; left: 0; right: 0; height: var(--mockbar); z-index: 100;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font: 500 10.5px/1 var(--font-mono); letter-spacing: .08em; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-app)); border-bottom: 1px solid var(--line); }

/* ---------- 3 層 (左パネル / 右パネル / 中央) ---------- */
#app { position: fixed; left: 0; right: 0; top: var(--mockbar); bottom: 0; overflow: hidden; background: var(--bg-app); }
.panel { position: absolute; top: 0; bottom: 0; width: calc(100% - var(--peek)); visibility: hidden;
  background: var(--bg-panel); display: flex; flex-direction: column; }
#left { left: 0; }
#right { right: 0; }
#app[data-reveal="left"] #left, #app[data-reveal="right"] #right { visibility: visible; }
#center { position: absolute; inset: 0; background: var(--bg-center); display: flex; flex-direction: column;
  will-change: transform; z-index: 2; }
#center.shifted { box-shadow: var(--shadow); border-radius: 14px; overflow: hidden; }
#shield { position: absolute; inset: 0; z-index: 20; display: none; background: var(--scrim); opacity: 0; touch-action: none; }
#center.shifted #shield { display: block; }
#app.dragging, #app.dragging * { user-select: none; -webkit-user-select: none; }

/* 端のスワイプの表示 (Android では戻るジェスチャの領域) */
.edge-hint { position: absolute; top: 0; bottom: 0; width: 24px; z-index: 60; pointer-events: none; opacity: 0;
  transition: opacity .25s; display: flex; align-items: center; }
.edge-hint.left { left: 0; background: linear-gradient(90deg, var(--accent-soft), transparent); }
.edge-hint.right { right: 0; justify-content: flex-end; background: linear-gradient(270deg, var(--accent-soft), transparent); }
.edge-hint.show { opacity: 1; }
.edge-hint span { font: 500 10px/1.3 var(--font-mono); color: var(--accent); writing-mode: vertical-rl; padding: 4px 2px; }

/* ---------- 共通の部品 ---------- */
.iconbtn { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; color: var(--tx-2); position: relative; flex: none; }
.iconbtn:active { background: var(--bg-pressed); }
.badge-dot { position: absolute; top: 11px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 2px var(--bg-center); }
.badge-num { position: absolute; top: 6px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--hand-bar); color: #fff; font: 600 11px/18px var(--font-mono); text-align: center; box-shadow: 0 0 0 2px var(--bg-center); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: 6px;
  font: 500 11.5px/1 var(--font-ui); white-space: nowrap; }
.chip svg.i { width: 13px; height: 13px; stroke-width: 2; }
.tone-impl { color: var(--impl-fg); background: var(--impl-bg); }
.tone-rev { color: var(--rev-fg); background: var(--rev-bg); }
.tone-hand { color: var(--hand-fg); background: var(--hand-bg); }
.tone-done { color: var(--done-fg); background: var(--done-bg); }
.tone-wait { color: var(--wait-fg); background: var(--wait-bg); }
.tone-cancel { color: var(--cancel-fg); background: var(--cancel-bg); }
.pill { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; height: 20px; padding: 0 7px; border-radius: 10px;
  border: 1px solid var(--line-card); color: var(--tx-3); font: 400 11px/1 var(--font-mono); white-space: nowrap; overflow: hidden; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ring-stop); flex: none; }
.ring.alive { border-color: var(--ring-run); }
.ring.turn { border-color: var(--ring-track); border-top-color: var(--ring-run); animation: yspin .9s linear infinite; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--tx-5); }
.notify-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.section-h { display: flex; align-items: center; gap: 6px; padding: 14px 16px 6px; color: var(--tx-3);
  font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; }
.section-h .grow { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(12px); z-index: 90;
  background: var(--tx); color: var(--bg-center); padding: 10px 14px; border-radius: 10px; font-size: 13.5px;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 48px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 中央: トップバー ---------- */
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.topbar .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-left: 2px; }
.topbar .title { font-size: 16px; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { display: flex; align-items: center; gap: 6px; min-width: 0; }

/* ---------- 会話 ---------- */
.msgs { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0 8px; overscroll-behavior: contain; }
.row { padding: 6px 16px; }
.row.user { display: flex; justify-content: flex-end; padding-top: 14px; }
.bubble { max-width: 86%; background: var(--bubble-bg); border: 1px solid var(--bubble-line); color: var(--tx);
  border-radius: 18px 18px 6px 18px; padding: 9px 13px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.bubble .mention { display: block; font: 500 12px/1.5 var(--font-mono); color: var(--accent); }
.md { font-size: 15px; line-height: 1.7; color: var(--tx-body); word-break: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h3 { font-size: 17px; margin: 18px 0 8px; color: var(--tx); font-weight: 650; }
.md h4 { font-size: 15.5px; margin: 16px 0 6px; color: var(--tx); font-weight: 650; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md strong { color: var(--accent-strong); font-weight: 600; }
.md code.inl { font: 13px/1 var(--font-mono); background: var(--bg-chip); border-radius: 4px; padding: 2px 5px; color: var(--tx); }
.code { margin: 4px 0 12px; border: 1px solid var(--line-card); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.code .lang { font: 500 10.5px/1 var(--font-mono); color: var(--tx-4); padding: 8px 12px 0; letter-spacing: .06em; }
.code pre { margin: 0; padding: 8px 12px 12px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); color: var(--tx); }
.tablewrap { margin: 4px 0 12px; overflow-x: auto; border: 1px solid var(--line-card); border-radius: 10px; }
.tablewrap table { border-collapse: collapse; font-size: 13.5px; line-height: 1.5; min-width: 100%; }
.tablewrap th, .tablewrap td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tablewrap th { color: var(--tx-3); font-weight: 600; font-size: 12.5px; background: var(--bg-inset); }
.tablewrap tr:last-child td { border-bottom: 0; }
.caret { display: inline-block; width: 8px; height: 16px; vertical-align: -3px; background: var(--accent); margin-left: 2px; animation: caret 1s steps(1) infinite; }

/* ツール・Yhtye の出来事: 控えめな 1 行。タップで開く */
.line { display: flex; align-items: center; gap: 8px; min-height: 32px; width: 100%; text-align: left; color: var(--tx-3);
  font: 400 12.5px/1.4 var(--font-mono); padding: 4px 0; }
.line .lbl { color: var(--tx-2); flex: none; }
.line .arg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .st { flex: none; }
.line .st.ok { color: var(--done-bar); } .line .st.err { color: var(--hand-bar); } .line .st.run { color: var(--tx-3); }
.line .chev { flex: none; color: var(--tx-4); transition: transform .15s; }
.line[aria-expanded="true"] .chev { transform: rotate(90deg); }
.line.yhtye .lbl { color: var(--accent); }
.line.notice { color: var(--hand-card-meta); }
.line.notice .lbl { color: var(--hand-bar); }
.sub-lines { padding-left: 26px; border-left: 1px solid var(--line); margin-left: 9px; }
.out { margin: 2px 0 6px 26px; padding: 8px 10px; border-radius: 8px; background: var(--bg-inset); border: 1px solid var(--line);
  font: 12px/1.55 var(--font-mono); color: var(--tx-2); white-space: pre; overflow-x: auto; }
.grouplist { margin: 2px 0 8px 26px; border: 1px solid var(--line-card); border-radius: 10px; overflow: hidden; }
.grouplist button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; text-align: left; border-top: 1px solid var(--line); }
.grouplist button:first-child { border-top: 0; }
.grouplist .n { font: 11px/1 var(--font-mono); color: var(--tx-5); width: 12px; }
.grouplist .tid { font: 500 12px/1 var(--font-mono); color: var(--tx-3); }
.grouplist .tt { flex: 1; min-width: 0; font-size: 13.5px; color: var(--tx-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { margin: auto; padding: 32px; text-align: center; color: var(--tx-3); font-size: 14px; line-height: 1.7; }
.empty b { display: block; color: var(--tx); font-size: 16px; margin-bottom: 4px; }

/* グループ待機の帯 (コンポーザの上) */
.waitbar { flex: none; margin: 0 12px 6px; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 12px;
  border: 1px dashed var(--line-dashed); border-radius: 10px; color: var(--tx-3); font-size: 12.5px; text-align: left; }
.waitbar .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.waitbar .hand { color: var(--hand-fg); background: var(--hand-bg); border-radius: 6px; padding: 2px 7px; font-weight: 600; font-size: 11.5px; }

/* コンポーザ */
.composer { flex: none; padding: 4px 10px calc(10px + env(safe-area-inset-bottom)); }
.composer .state { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; font: 12px/1 var(--font-mono); color: var(--tx-3); }
.composer .box { display: flex; align-items: flex-end; gap: 6px; background: var(--bg-inset); border: 1px solid var(--line-card);
  border-radius: 24px; padding: 4px 4px 4px 16px; }
.composer .box:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-card)); }
.composer textarea { flex: 1; min-height: 40px; max-height: 128px; resize: none; border: 0; outline: 0; background: transparent;
  padding: 9px 0; font-size: 15.5px; line-height: 22px; color: var(--tx); }
.composer textarea::placeholder { color: var(--tx-4); }
.sendbtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); flex: none; }
.sendbtn:disabled { background: var(--bg-chip); color: var(--tx-4); }
.sendbtn.stop { background: var(--bg-chip); color: var(--tx); border: 1px solid var(--line-card); }
.sendbtn.stop svg { fill: currentColor; stroke: none; width: 14px; height: 14px; }
.mentions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 6px; }
.mchip { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; height: 30px; padding: 0 6px 0 10px; border-radius: 15px;
  background: var(--accent-soft); color: var(--accent); font: 500 12px/1 var(--font-mono); }
.mchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 左パネル ---------- */
#left .cols { flex: 1; min-height: 0; display: flex; }
.rail { width: 68px; flex: none; background: var(--bg-rail); overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.proj { position: relative; width: 48px; height: 48px; border-radius: 24px; background: var(--bg-chip); color: var(--tx-2);
  display: grid; place-items: center; font: 600 15px/1 var(--font-mono); transition: border-radius .15s; }
.proj.sel { border-radius: 15px; background: var(--accent); color: var(--on-accent); }
.proj::before { content: ""; position: absolute; left: -10px; width: 4px; height: 0; border-radius: 0 4px 4px 0; background: var(--tx); transition: height .15s; }
.proj.sel::before { height: 36px; }
.proj .ring { position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px; border-width: 2.5px; background: var(--bg-rail); }
.proj .notify-dot { position: absolute; right: -1px; top: -1px; box-shadow: 0 0 0 3px var(--bg-rail); }
.rail .sep { width: 28px; height: 2px; border-radius: 1px; background: var(--line); }
.tree { flex: 1; min-width: 0; overflow-y: auto; padding-bottom: 12px; }
.tree-head { padding: 14px 16px 4px; }
.tree-head .pname { font-size: 17px; font-weight: 650; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-head .ppath { font: 11px/1.4 var(--font-mono); color: var(--tx-4); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 12px 0 10px; text-align: left; color: var(--tx-2); }
.wt .chev { color: var(--tx-4); transition: transform .15s; }
.wt[aria-expanded="true"] .chev { transform: rotate(90deg); }
.wt .bname { flex: 1; min-width: 0; font: 12.5px/1.3 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt .dot.main { background: var(--done-bar); }
.wt .add { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 18px; color: var(--tx-3); margin-right: -6px; }

/* ======================= 画面の積み重ねと「戻る」 =======================
   状態 = { panel: null|'left'|'right', screen: null|'detail'|'settings', task }。開くたびに history に積む。

  if (next.panel === 'right') renderRight();

    const el = $(id), want = next.screen === id;

      else renderSettings();

const panelOpen = () => nav.panel !== null;
const screenOpen = () => nav.screen !== null;

/* ======================= パネルの位置 ======================= */

/* ======================= ジェスチャ =======================
   ルール:
   1. 画面の左右 24px から始まったタッチは Android の「戻る」ジェスチャ用として無視する (端を光らせて知らせる)。
   2. 横にスクロールできる要素 (.hscroll: コードブロック・表・ツールの出力) の上で始まったら、その要素のスクロールを優先する。
   3. 最初の 10px の向きで決める。横 (|dx| > |dy|) ならパネルのドラッグ、縦なら縦スクロールに固定し、その指では横に切り替えない。

  const was = g; g = null;
  app.classList.remove('dragging');
  if (was.mode === 'native' && was.mouse && suppressClick) setTimeout(() => suppressClick = false, 0);
  if (was.mode !== 'drag') return;
  suppressClick = true; setTimeout(() => suppressClick = false, 0);
  const s = was.samples, a = s[0], b = s[s.length - 1];
  const v = b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0;
  const W = panelW();
  const snaps = [-W, 0, W].filter(p => p >= (was.base > 0 ? 0 : -W) && p <= (was.base < 0 ? 0 : W));
  let target;
  if (Math.abs(v) > FLING) target = v > 0 ? (snaps.find(p => p > pos + 0.5) ?? snaps[snaps.length - 1]) : ([...snaps].reverse().find(p => p < pos - 0.5) ?? snaps[0]);
  else target = snaps.reduce((best, p) => Math.abs(p - pos) < Math.abs(best - pos) ? p : best, snaps[0]);
  const dist = Math.abs(target - pos), ms = Math.max(120, Math.min(300, dist / Math.max(Math.abs(v), 1.1)));
  setPos(target, ms);
  const panel = target > 0 ? 'left' : target < 0 ? 'right' : null;
  if (panel !== nav.panel) {
    if (panel && !nav.panel) pushNav({panel});
    else if (!panel) back();
  }
}
app.addEventListener('pointerup', endGesture);
app.addEventListener('pointercancel', endGesture);   // 縦スクロールが始まるとブラウザが cancel を送る
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
shield.addEventListener('click', () => { if (panelOpen()) back(); });

/* ======================= 操作 ======================= */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }
function selectChat(id) {
  ui.chatId = id; const f = findChat(id); ui.projectId = f.p.id; f.c.notify = false;
  renderLeft(); renderCenter(); $('msgs').scrollTop = $('msgs').scrollHeight; renderRight();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act !== 'dmenu' && $('dmenu')) $('dmenu').classList.remove('open');
  switch (act) {
    case 'open-left': pushNav({panel: 'left'}); break;
    case 'open-right': renderRight(); pushNav({panel: 'right'}); break;
    case 'project': {
      const p = PROJECTS.find(q => q.id === el.dataset.id); ui.projectId = p.id; ui.branchForm = false; renderLeft(); break;
    }
    case 'chat': selectChat(el.dataset.id); back(); break;
    case 'toggle-wt': { const w = project().worktrees[+el.dataset.wt]; w.open = !w.open; renderLeft(); break; }
    case 'toggle-others': { const k = 'others:' + ui.projectId; ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); renderLeft(); break; }
    case 'newchat': {
      const w = project().worktrees[+el.dataset.wt], id = 'C-' + (20 + Math.floor(Math.random() * 900));
      w.chats.unshift({id, title: '', state: 'idle', ago: 'now', groups: [], msgs: []}); w.open = true;
      selectChat(id); back(); setTimeout(() => $('input').focus(), 300); break;
    }
    case 'newchat-branch': {
      const p = project(), b = el.dataset.branch; p.otherBranches = p.otherBranches.filter(x => x !== b);
      const id = 'C-' + (20 + Math.floor(Math.random() * 900));
      p.worktrees.push({branch: b, open: true, chats: [{id, title: '', state: 'idle', ago: 'now', groups: [], msgs: []}]});
      selectChat(id); toast(`${b} の作業ツリーを作りました (モック)`); back(); break;
    }
    case 'branch-new': ui.branchForm = !ui.branchForm; ui.branchErr = ''; renderLeft(); if (ui.branchForm) setTimeout(() => $('bname')?.focus(), 50); break;
    case 'branch-cancel': ui.branchForm = false; renderLeft(); break;
    case 'settings': pushNav({screen: 'settings'}); break;
    case 'theme': ui.theme = el.dataset.k; applyTheme(); renderSettings(); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'toggle': { const k = el.dataset.key; ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k);
      if (k.startsWith('d:')) renderDetail(nav.task); else renderMsgs(false); break; }
    case 'toggle-group': { const k = 'g:' + el.dataset.id; ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); renderRight(); break; }
    case 'task': pushNav({screen: 'detail', task: el.dataset.id}); break;
    case 'dtab': ui.detailTab = el.dataset.k; renderDetail(nav.task); break;
    case 'dmenu': $('dmenu').classList.toggle('open'); break;
    case 'back': back(); break;
    case 'mention': {
      const t = TASKS[el.dataset.id];
      if (!ui.mentions.some(m => m.id === t.id)) ui.mentions.push({id: t.id, title: t.title});
      back(nav.depth); renderComposer(); setTimeout(() => $('input').focus(), 320); break;
    }
    case 'unmention': ui.mentions.splice(+el.dataset.i, 1); renderComposer(); break;
    case 'cancel-task': confirmDialog('タスクを中止しますか', `${el.dataset.id} の担当エージェントを止め、タスクを中止します。オーケストレータに通知されます。`, '中止する', () => {
      const t = TASKS[el.dataset.id]; t.status = 'cancelled'; t.cancelNote = '中止: ユーザーが中止'; delete t.callout;
      renderDetail(t.id); renderRight(); renderCenter(false); toast(`${t.id} を中止しました (モック)`);
    }); break;
    case 'retry-merge': toast('マージを再試行しました (モック)'); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'bform') return; e.preventDefault();
  const name = $('bname').value.trim();
  if (!/^[\w.\-/]+$/.test(name) || name.endsWith('/')) { ui.branchErr = 'ブランチ名が正しくありません'; renderLeft(); return; }
  const p = project();
  if (p.worktrees.some(w => w.branch === name) || p.otherBranches.includes(name)) { ui.branchErr = 'そのブランチはもうあります'; renderLeft(); $('bname').value = name; return; }
  const id = 'C-' + (20 + Math.floor(Math.random() * 900));
  p.worktrees.push({branch: name, open: true, chats: [{id, title: '', state: 'idle', ago: 'now', groups: [], msgs: []}]});
  ui.branchForm = false; selectChat(id); back();
});
function confirmDialog(title, body, ok, fn) {
  const d = $('dialog');
  d.innerHTML = `<div class="dialog" role="alertdialog"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="acts"><button class="btn text" id="dno">キャンセル</button><button class="btn text" id="dok" style="color:var(--hand-bar)">${esc(ok)}</button></div></div>`;
  d.classList.add('open');
  const close = () => d.classList.remove('open');
  $('dno').onclick = close; $('dok').onclick = () => { close(); fn(); };
  d.onclick = ev => { if (ev.target === d) close(); };
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('dialog').classList.contains('open')) $('dialog').classList.remove('open'); else back(); }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'input') send();
});

/* ======================= コンポーザ (送信 / 中止 / 応答の真似) ======================= */
const input = $('input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(128, input.scrollHeight) + 'px'; renderComposer(); });
$('send').addEventListener('click', () => { ui.turn[ui.chatId] ? stopTurn(ui.chatId) : send(); });
const timers = {};
function send() {
  const text = input.value.trim(); if (!text && !ui.mentions.length) return;
  const c = chat();
  const mention = ui.mentions.map(m => `@${m.id} ${m.title}`).join('\n');
  c.msgs.push({type: 'user', text: text || '(本文なし)', mention: mention || null});
  if (!c.title) c.title = text.slice(0, 24) || 'メンションのみ';
  c.ago = 'now'; input.value = ''; input.style.height = ''; ui.mentions = [];
  const coldStart = c.state === 'idle';
  ui.turn[c.id] = coldStart ? 'starting' : 'running';
  renderCenter(); $('msgs').scrollTop = $('msgs').scrollHeight; renderLeft();
  simulateReply(c, text, coldStart ? 1600 : 400);
}
function simulateReply(c, text, delay) {
  const id = c.id;
  const reply = md('受け取りました。**これはモックの返答** です。PC にはつながっていません。', '', '- 実際にはここにオーケストレータの返事が Markdown で流れてきます', '- ツール呼び出しは上のような控えめな 1 行に畳まれます');
  timers[id] = [];
  const at = (ms, fn) => timers[id].push(setTimeout(fn, ms));
  at(delay, () => { c.state = 'alive'; ui.turn[id] = 'running'; c.msgs.push(tools(tl('Read', 'README.md', 'run'))); refresh(id); });
  at(delay + 900, () => { c.msgs[c.msgs.length - 1].items[0].st = 'ok'; c.msgs.push({type: 'live', text: ''}); refresh(id); });
  const chars = [...reply]; let n = 0;
  const tick = () => {
    if (!ui.turn[id]) return;
    n = Math.min(chars.length, n + 3);
    c.msgs[c.msgs.length - 1].text = chars.slice(0, n).join('');
    refresh(id);
    if (n < chars.length) timers[id].push(setTimeout(tick, 28));
    else { c.msgs[c.msgs.length - 1].type = 'md'; delete ui.turn[id]; refresh(id); renderLeft(); }
  };
  at(delay + 1100, tick);
}
function stopTurn(id) {
  (timers[id] || []).forEach(clearTimeout); timers[id] = [];
  const c = findChat(id).c;
  const last = c.msgs[c.msgs.length - 1];
  if (last && last.type === 'live') { if (last.text) last.type = 'md'; else c.msgs.pop(); }
  c.msgs.forEach(m => m.type === 'tools' && m.items.forEach(t => { if (t.st === 'run') t.st = 'err'; }));
  c.msgs.push({type: 'yhtye', label: 'ターンを中止', arg: 'ユーザーが中止しました', st: 'err'});
  delete ui.turn[id]; c.state = 'alive';
  refresh(id); renderLeft();
}
function refresh(id) { if (id === ui.chatId) { renderMsgs(); renderComposer(); renderTopbar(); } }

// 最初から走っている C-7 のターン: 少し進めてから、しばらく作業中のまま (中止ボタンを試せるように)
(function initialTurn() {
  const c = findChat('C-7').c; timers['C-7'] = [];
  const text = md('`order.ts` の `OrderV2` を deprecated にして、v3 の型から v2 の形を作る変換を足しています。', '', '~~~ts', 'export const toOrderV2 = (o: OrderV3): OrderV2 => ({ total: Number(o.total.amount), currency: "JPY" })  // T-110 のレガシー側はこれを使う', '~~~', '', '終わったら T-110 に「v3 に合わせる、レガシーは `toOrderV2` を通す」と返答して再開させます。');
  const chars = [...text]; let n = 0;
  const tick = () => {
    if (!ui.turn['C-7']) return;
    n = Math.min(chars.length, n + 2);
    c.msgs[c.msgs.length - 1].text = chars.slice(0, n).join('');
    refresh('C-7');
    if (n < chars.length) timers['C-7'].push(setTimeout(tick, 45));
  };
  timers['C-7'].push(setTimeout(tick, 1200));
})();

/* ======================= テーマ ======================= */
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() { document.documentElement.dataset.theme = ui.theme === 'system' ? (mq.matches ? 'dark' : 'light') : ui.theme; }
mq.addEventListener('change', applyTheme);
const qp = new URLSearchParams(location.search);
if (['light', 'dark'].includes(qp.get('theme'))) ui.theme = qp.get('theme');
applyTheme();

renderLeft(); renderCenter(); renderRight();
$('msgs').scrollTop = $('msgs').scrollHeight;
</script>
